/* 2.0: compact, game-like collection, dispatch and battle interfaces */
.tabs{grid-template-columns:repeat(5,1fr);padding:10px 10px 8px;gap:3px}

function zone(x,y){return x>=70?(y>=24?5:4):(y>=24?2:0)+(x>=35?1:0)}

function hash(x,y,k=0){return rnd(x*23.7+y*97.1+k*117.09)}
function walkBridge(x,y){return (x>=33&&x<=36&&((y>=10&&y<=16)||(y>=32&&y<=38)))||(x>=69&&x<=70&&((y>=9&&y<=15)||(y>=32&&y<=38)))||(y>=22&&y<=25&&((x>=12&&x<=18)||(x>=51&&x<=58)))}
function tile(x,y){if(x<0||y<0||x>=W||y>=H)return 'wall';if((x===34||x===35||x===69||x===70||y===23||y===24)&&!walkBridge(x,y))return 'water';if(x>7&&x<30&&y>6&&y<22)return 'ground';for(const p of pois)if(Math.hypot(p.x-x,p.y-y)<3)return 'ground';if(walkBridge(x,y))return 'bridge';const h=hash(x,y,1),z=zone(x,y);if(h>.918&&z!==2)return 'rock';if(h>.84&&z===2)return 'tree';if(h>.885&&z===0)return 'tree';if(h>.926&&z===3)return 'rock';return 'ground'}
function isSolid(x,y){const t=tile(Math.floor(x),Math.floor(y));return t==='water'||t==='rock'||t==='tree'||t==='wall'}
function canWalk(x,y){const r=.19;return !isSolid(x-r,y-r)&&!isSolid(x+r,y-r)&&!isSolid(x-r,y+r)&&!isSolid(x+r,y+r)}
function createWild(){const arr=[],N=40;for(let i=0;i<N;i++){const z=i%4,tx=[5,38,5,38][z],ty=[4,4,27,27][z],ww=[27,28,27,28][z],hh=[16,15,18,17][z];let x,y,tries=0;do{x=tx+2+Math.floor(hash(i,tries,state.seed)*Math.max(2,ww-4));y=ty+2+Math.floor(hash(tries,i,state.seed+5)*Math.max(2,hh-4));tries++}while((isSolid(x+.5,y+.5)||pois.some(p=>Math.hypot(p.x-x-.5,p.y-y-.5)<3)||arr.some(p=>Math.hypot(p.x-x,p.y-y)<1.7))&&tries<80);if(tries>=80)continue;const list=types.filter(t=>t.biome===z),s=list[Math.floor(hash(i,state.day,state.seed)*list.length)];arr.push({id:state.day*100+i,species:s.id,x:x+.5,y:y+.5,homeX:x+.5,homeY:y+.5,wander:hash(i,6)*6.28})}state.wild=arr}

function journalPanel(){return `<div class="sectionTitle"><h2>Field journal</h2><small>Case evidence</small></div><div class="controlBox"><h3>Your management record</h3><p>${state.crew.length} recruits · ${state.totalWork} units of output · ${state.contracts.filter(Boolean).length} contracts delivered.</p><div class="btnRow" style="margin:0"><button class="ghost" data-open="codex">Theory guide</button><button class="ghost" data-export="1">Export debrief</button></div></div><details class="controlBox"><summary style="cursor:pointer;font-weight:800;font-size:12px;color:var(--lime)">Creature collection · ${state.caught.length} / 12 bonded</summary><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px">${types.map(t=>`<div style="text-align:center;opacity:${state.seen.includes(t.id)?1:.3}">${cAvatar(t)}<div class="tiny">${state.seen.includes(t.id)?t.name:'???'}</div><div style="font-size:9px;color:var(--lime)">${state.caught.includes(t.id)?'BONDED':state.seen.includes(t.id)?'SEEN':'UNKNOWN'}</div></div>`).join('')}</div></details><div class="miniTitle">Recent decisions</div>${state.logs.map(l=>`<div class="journalRow"><span class="hintTag">Day ${l.day}</span><div>${l.msg}</div></div>`).join('')}`}
function overlay(type,html,closable=true,large=false){modalType=type;modalClosable=closable;$('#modalBody').innerHTML=html;$('#cover').classList.remove('hidden');$('#modal').classList.toggle('large',large);$('#modalClose').style.display=closable?'':'none'}
function closeModal(){if(!modalClosable)return;modalType='';modalContext=null;$('#cover').classList.add('hidden');if(!state.crew.length&&!state.finished&&state.day<=10){starters();return}canvas.focus()}
function welcome(hasSave){overlay('start',`<div class="eyebrow">A world powered by people</div><h2>Find your monsters.<br>Unlock their potential.</h2><div class="startArt">${cAvatar(types[0])}${cAvatar(types[3])}${cAvatar(types[2])}</div><p class="lead">Explore six wild regions, recruit a remarkable crew, and manage their motivation. Your HR decisions determine whether your business thrives.</p><div class="results"><div class="resultCell"><b>6</b><small>Regions</small></div><div class="resultCell"><b>12</b><small>Creatures</small></div><div class="resultCell"><b>10</b><small>Workdays</small></div></div><div class="btnRow">${hasSave?'<button class="cta" data-start="continue">Continue expedition</button><button class="ghost" data-start="new">Start again</button>':'<button class="cta" data-start="new">Begin expedition</button>'}<button class="ghost" data-open="help">Controls & how to play</button></div>`,false,true)}
function starters(){overlay('starter',`<div class="eyebrow">Your first team member</div><h2>Choose a partner</h2><p>Each recruit has a different workplace strength and motivational need. You can recruit more creatures by exploring.</p><div class="choiceGrid">${['mossbun','voltusk','glimmeray'].map(id=>{const t=species(id);return `<button class="choice" data-starter="${id}">${cAvatar(t)}<strong>${t.name}</strong><span>${t.desc}</span><small>${ROLE[t.role].label} · ${cNeed(t.need)}</small></button>`}).join('')}</div>`,false,true)}
function help(){overlay('help',`<div class="eyebrow">Explorer's handbook</div><h2>How to play</h2><div class="results"><div class="resultCell"><b>WASD</b><small>Move</small></div><div class="resultCell"><b>E</b><small>Interact</small></div><div class="resultCell"><b>SPACE</b><small>Trust pulse</small></div></div><p><b>1. Explore and recruit.</b> Walk towards a roaming monster and press E. Offer something it values, then stop the moving needle in the green zone to form a pact.</p><p><b>2. Build a workforce.</b> Assign up to six recruits to Harvest, Craft or Explore. Matching their natural strengths improves output. Use HR actions to reward, train, empower or support them.</p><p><b>3. Run the business.</b> Choose your target-led, balanced or supportive policy. Return to Base Camp to finish the day, then deliver production contracts at Guild Hall.</p><p><b>4. Win thoughtfully.</b> Deliver all three contracts within ten workdays. High productivity matters, but so do morale, welfare and retention. Discover why the same motivator does not work for everyone.</p><p class="tiny">SHIFT = sprint · 1–4 = sidebar panels · Click Save to store locally in this browser · On touchscreens use the direction pad.</p><div class="btnRow"><button class="cta" data-dismiss="1">${state.crew.length?'Back to game':'Back'}</button><button class="ghost" data-open="codex">Motivation theory guide</button></div>`)}
function codex(){overlay('codex',`<div class="eyebrow">Cambridge Business 9609</div><h2>Motivation field guide</h2><p>These theories explain why different rewards and conditions have different effects. The game simplifies reality: individual preferences and organisational context still matter.</p><div class="stack">${[
['Taylor','Pay, incentives and output','Financial rewards such as bonuses and piece rates can increase effort, especially when effort visibly links to reward.'],
['Mayo','Social relationships','Belonging, communication and group identity can be important influences on morale.'],
['Maslow','Hierarchy of needs','Unmet welfare and security needs can limit the effectiveness of recognition and higher-level rewards.'],
['Herzberg','Motivators and hygiene factors','Pay and conditions can prevent dissatisfaction; recognition, achievement, responsibility and growth can create satisfaction.'],
['McClelland','Achievement, power, affiliation','Some people value challenging goals; others value relationships or influence.'],
['Vroom','Expectancy theory','Motivation depends on believing effort can lead to performance, rewards and outcomes the individual values.'],

['Soft HRM (A Level)','Workforce as an asset','Emphasises development, trust, involvement and commitment, although it can require more time and funding.']
].map(([a,b,c])=>`<div class="controlBox" style="margin:0"><h3>${a} · ${b}</h3><p style="margin:0">${c}</p></div>`).join('')}</div><div class="btnRow"><button class="cta" data-dismiss="1">Back to game</button></div>`,true,true)}
function encounter(w){const t=species(w.species);if(!state.seen.includes(t.id)){state.seen.push(t.id);save()}modalContext={wildId:w.id,stage:'offer',trust:28+Math.round(hash(w.id,5)*19),pulses:0,needle:0,phase:Math.random()*6,target:.28+Math.random()*.40,offer:null};overlay('encounter',`<div class="eyebrow">Wild encounter · ${zones[t.biome][0]}</div><h2>Meet ${t.name}</h2><div style="display:flex;gap:13px;align-items:center">${cAvatar(t)}<p style="margin:0">${t.desc}<br><span style="color:var(--lime)">Likely needs: ${cNeed(t.need)}</span></p></div><h3>What would make this creature want to join?</h3><p style="margin:0">Make a genuine recruitment offer. Stronger matches build trust faster; offers cost credits.</p><div class="offerButtons">${offers.map(o=>`<button class="offer" data-offer="${o.id}" ${state.cash<o.cost?'disabled':''}><strong>${o.title}</strong><span>${o.hint}</span><em>${o.cost} credits</em></button>`).join('')}</div><p class="footNote">Recruits choose to join. A poor offer may be rescued by skilful trust pulses, but will be harder to recruit.</p>`,true,true)}
function recruitOffer(id){const m=modalContext,w=state.wild.find(v=>v.id===m?.wildId),o=offers.find(v=>v.id===id);if(!m||!w||!o||state.cash<o.cost)return;const t=species(w.species);state.cash-=o.cost;m.offer=o;m.stage='pulse';const fit=id===t.need?36:(id==='security'||id==='belonging'?19:13);m.trust=clamp(m.trust+fit,0,100);save();$('#modalBody').innerHTML=`<div class="eyebrow">Resonance pact · ${t.theory}</div><h2>Earn ${t.name}'s trust</h2><div style="display:flex;align-items:center;gap:14px">${cAvatar(t)}<p style="margin:0">${id===t.need?'Excellent fit! You understood what this creature values.':'A valid offer, but not its strongest motivational need.'}<br><small>${o.theory}</small></p></div><div class="dial"><div class="progressLine"><span>Trust</span><strong id="trustNumber">${m.trust}%</strong></div><div class="meter" style="height:12px"><i id="trustFill" style="width:${m.trust}%"></i></div><div class="dialTrack"><div class="dialZone" id="dialZone" style="left:${(m.target-.105)*100}%;width:21%"></div><div class="dialNeedle" id="dialNeedle"></div></div><div class="progressLine"><span>Stop the needle in the green zone</span><strong id="pulseCount">3 pulses</strong></div><button class="cta wide" data-pulse="1">PULSE · SPACE</button><p class="kbdHint" style="text-align:center;margin-bottom:0">Well-timed pulses build trust. Three attempts. Reach 90% to recruit.</p></div>`;renderSide()}
function pulse(){const m=modalContext;if(modalType!=='encounter'||m?.stage!=='pulse')return;const d=Math.abs(m.needle-m.target);const gain=d<.055?26:d<.115?18:d<.19?7:-10;m.trust=clamp(m.trust+gain,0,100);m.pulses++;const el=$('#trustFill');if(el)el.style.width=m.trust+'%';$('#trustNumber').textContent=m.trust+'%';$('#pulseCount').textContent=`${Math.max(0,3-m.pulses)} pulses`;if(m.trust>=90){completeRecruit(true);return}if(m.pulses>=3){completeRecruit(false);return}showToast(gain>15?'Good connection! +'+gain+' trust':gain>0?'Partial connection. +'+gain+' trust':'Missed the resonance window. '+gain+' trust')}
function completeRecruit(success){const m=modalContext,w=state.wild.find(v=>v.id===m?.wildId);if(!w)return;state.wild=state.wild.filter(v=>v.id!==w.id);const t=species(w.species);if(success&&state.crew.length<6){const c=makeCrew(t.id);c.morale=clamp(56+m.trust*.25,0,100);c.trust=clamp(m.trust,0,100);state.crew.push(c);selected=state.crew.length-1;state.rep+=3;state.everRecruited++;if(!state.caught.includes(t.id))state.caught.push(t.id);log(`${c.name} joined. Recruitment offer: ${m.offer.title}.`);overlay('recruited',`<div class="eyebrow">Pact formed!</div><h2>${t.name} recruited</h2><div class="startArt">${cAvatar(t)}</div><p class="lead">${c.name} has joined your crew. Their strongest need is <b>${cNeed(t.need)}</b>. The initial offer influenced trust; future management will determine performance and loyalty.</p><div class="btnRow"><button class="cta" data-dismiss="1">Explore the world</button><button class="ghost" data-goto="crew" data-dismiss="1">Assign a role</button></div>`,true);tab('crew')}else{state.failed++;log(`${t.name} chose not to join. Matching an individual's needs creates a stronger recruitment offer.`);overlay('recruitFail',`<div class="eyebrow">Recruitment unsuccessful</div><h2>${t.name} slipped away</h2><p class="lead">The pact did not reach enough trust. Consider its needs before choosing an offer, then time the pulses carefully. There are other creatures throughout the world.</p><div class="btnRow"><button class="cta" data-dismiss="1">Keep exploring</button></div>`,true)}save()}
function runAction(id){const a=actions.find(x=>x.id===id),c=state.crew[selected];if(!a||!c||state.actionsLeft<=0||state.cash<a.cost)return;const sp=species(c.species),match=sp.need===({bonus:'pay',recognition:'recognition',training:'growth',empower:'autonomy',team:'belonging',wellbeing:'security',stretch:'achievement',rotate:'growth'})[id];const boost=match?1.7:1;state.cash-=a.cost;state.actionsLeft--;let effects='';switch(id){case'bonus':c.morale=clamp(c.morale+Math.round(11*boost),0,100);c.trust=clamp(c.trust+Math.round(5*boost),0,100);c.rewarded++;effects='morale and trust rose';break;case'recognition':c.morale=clamp(c.morale+Math.round(12*boost),0,100);c.trust=clamp(c.trust+8,0,100);effects='recognition lifted morale';break;case'training':c.skill=clamp(c.skill+1,1,5);c.energy=clamp(c.energy-9,0,100);c.morale=clamp(c.morale+Math.round(6*boost),0,100);c.trained++;effects='skills increased, using some energy';break;case'empower':c.morale=clamp(c.morale+Math.round(10*boost),0,100);c.trust=clamp(c.trust+Math.round(10*boost),0,100);c.boost+=.12;effects='ownership and trust improved';break;case'team':state.crew.forEach(v=>v.morale=clamp(v.morale+4,0,100));c.morale=clamp(c.morale+Math.round(9*boost),0,100);c.trust=clamp(c.trust+Math.round(7*boost),0,100);effects='the whole team connected';break;case'wellbeing':c.energy=clamp(c.energy+Math.round(28*boost),0,100);c.morale=clamp(c.morale+8,0,100);c.trust=clamp(c.trust+6,0,100);effects='energy recovered and morale improved';break;case'stretch':c.boost+=match?.33:.22;c.energy=clamp(c.energy-14,0,100);c.morale=clamp(c.morale+(match?12:-6),0,100);c.trust=clamp(c.trust+(match?5:-4),0,100);effects=match?'the challenge energised this achiever':'output may rise, but stress increased';break;case'rotate':c.skill=clamp(c.skill+1,1,5);c.morale=clamp(c.morale+Math.round(5*boost),0,100);c.boost+=.06;effects='job enrichment developed wider skills';break}
const msg=`${c.name}: ${a.name.toLowerCase()} — ${effects}. ${match?'This suits their strongest motivational need.':'The effect is smaller than a direct fit to their needs.'}`;log(msg);renderSide();overlay('feedback',`<div class="eyebrow">People decision · ${a.label}</div><h2>${c.name}: ${a.name}</h2><p class="lead">${effects.charAt(0).toUpperCase()+effects.slice(1)}. ${match?'This strategy fits their strongest motivational need.':'This helps, but a different motivator might fit their needs better.'}</p><div class="tipBox"><b>Business link:</b> ${a.theory}</div><div class="btnRow"><span class="miniBadge">${state.actionsLeft} HR actions left today</span><button class="cta" data-dismiss="1">Continue</button></div>`,true)}
function selectPolicy(p){if(!['hard','balanced','soft'].includes(p))return;state.policy=p;log(`Workforce policy set to ${p==='hard'?'target-led (hard HRM)':p==='soft'?'supportive (soft HRM)':'balanced'}.`);renderSide()}
function dayAdvance(){if(state.day>10||state.finished)return;if(!state.crew.length){overlay('note',`<div class="eyebrow">Base Camp</div><h2>A business needs a team</h2><p>Recruit at least one creature before finishing a workday. Explore the meadow and approach a roaming creature with <b>E</b>.</p><div class="btnRow"><button class="cta" data-dismiss="1">Back to the world</button></div>`);return}
let output={grove:0,forge:0,scout:0},departed=[],examples=[];const pol=state.policy;const policyCost=pol==='soft'?14:0;
for(const c of [...state.crew]){const t=species(c.species),fit=c.role===t.role?1.2:.79,health=.48+c.energy/200+c.morale/250,trust=.72+c.trust/350,skill=1+(c.skill-1)*.125;let policy=pol==='hard'?1.25:pol==='soft'?1.10:1;let units=Math.round((t.power/1.18)*fit*health*trust*skill*policy*(1+c.boost));units=clamp(units,0,100);output[c.role]+=units;state.totalWork+=units;examples.push({name:c.name,units,role:c.role});c.tenure++;if(pol==='hard'){c.energy=clamp(c.energy-27,0,100);c.morale=clamp(c.morale-11,0,100);c.trust=clamp(c.trust-7,0,100)}else if(pol==='soft'){c.energy=clamp(c.energy-15,0,100);c.morale=clamp(c.morale+4,0,100);c.trust=clamp(c.trust+3,0,100)}else{c.energy=clamp(c.energy-19,0,100);c.morale=clamp(c.morale-3,0,100);c.trust=clamp(c.trust-1,0,100)}c.boost=0;if(c.energy<18)c.morale=clamp(c.morale-9,0,100);c.energy=clamp(c.energy+11,0,100);if(c.morale<18||c.trust<12){const risk=c.morale<15||c.trust<10?.79:.35;if(Math.random()<risk){departed.push(`${c.name} (${t.name})`);state.crew=state.crew.filter(v=>v.id!==c.id);state.rep=clamp(state.rep-6,0,100)}}}
Object.keys(output).forEach(r=>state.resources[r]+=output[r]);const revenue=Math.round(output.grove*.58+output.forge*.70+output.scout*.66);const wages=state.crew.length*(pol==='hard'?4:pol==='soft'?9:7);const net=revenue-wages-policyCost;state.cash=Math.max(0,state.cash+net);state.rep=clamp(state.rep+(pol==='soft'?2:pol==='hard'&&overallMorale()<40?-2:0),0,100);const note=`Day ${state.day}: ${output.grove} harvest, ${output.forge} craft, ${output.scout} exploration. ${revenue} revenue − ${wages} wages${policyCost?' − '+policyCost+' welfare':''} = ${net>=0?'+':''}${net} credits.`;
state.policyHistory.push({day:state.day,policy:pol,output:output.grove+output.forge+output.scout,morale:overallMorale(),cash:state.cash,departed:departed.length});log(note);if(departed.length)log(`${departed.join(', ')} left after low trust or morale. Turnover damages reputation.`);selected=clamp(selected,0,Math.max(0,state.crew.length-1));const pastDay=state.day;state.day++;state.actionsLeft=3;state.used={};if(state.day<=10){createWild();createPickups()}save();renderSide();if(state.day>10){overlay('finalDay',`<div class="eyebrow">Day 10 completed · Final deliveries</div><h2>The season is ending</h2><p class="lead">All ten workdays have been completed. Any outstanding orders that have enough resources may still be delivered at Guild Hall. You can then finish the season from Guild Hall or Base Camp.</p><div class="btnRow"><button class="cta" data-dismiss="1">Visit Guild Hall</button><button class="ghost" data-finale="1">Finish now</button></div>`);return}
const first=contracts.find(c=>!state.contracts[c.id]);const ready=first&&Object.entries(first.needs).every(([r,n])=>state.resources[r]>=n);overlay('day',`<div class="eyebrow">Workday ${pastDay} completed</div><h2>Another day in the wild</h2><p class="lead">${note}</p><div class="results"><div class="resultCell"><b>${output.grove}</b><small>Harvest</small></div><div class="resultCell"><b>${output.forge}</b><small>Craft</small></div><div class="resultCell"><b>${output.scout}</b><small>Explore</small></div></div><div class="tipBox">${departed.length?'⚠ '+departed.join(', ')+' left the team. Unmet needs can raise labour turnover.':ready?'The next contract is ready. Visit Guild Hall to deliver it.':pol==='hard'?'Targets raised immediate output, but drained energy and morale. Watch for turnover.':pol==='soft'?'Employee involvement supported morale and trust, at an additional cost.':'Balanced management preserved flexibility, but fatigue still needs attention.'}</div><div class="btnRow"><button class="cta" data-dismiss="1">Day ${state.day}: Keep exploring</button><button class="ghost" data-goto="guild" data-dismiss="1">View contracts</button></div>`,true)}
function deliver(){const c=contracts.find(v=>!state.contracts[v.id]);if(!c)return;if(!Object.entries(c.needs).every(([r,n])=>state.resources[r]>=n)){overlay('note',`<div class="eyebrow">Guild Hall</div><h2>Contract in progress</h2><p>Keep producing to complete <b>${c.name}</b>. Assign crew roles, maintain morale and finish workdays at Base Camp.</p><div class="btnRow"><button class="cta" data-dismiss="1">Back to the world</button><button class="ghost" data-goto="guild" data-dismiss="1">View requirements</button></div>`);return}
Object.entries(c.needs).forEach(([r,n])=>state.resources[r]-=n);state.contracts[c.id]=true;state.cash+=c.reward;const late=state.day-1>c.deadline;const gain=late?Math.round(c.rep*.5):c.rep;state.rep=clamp(state.rep+gain,0,100);log(`${c.name} delivered ${late?'late':'on time'}: +${c.reward} credits, +${gain} reputation.`);renderSide();if(state.contracts.every(Boolean)){finish(true);return}overlay('delivered',`<div class="eyebrow">Guild contract delivered</div><h2>${c.name} complete!</h2><div class="results"><div class="resultCell"><b>+${c.reward}</b><small>Credits</small></div><div class="resultCell"><b>+${gain}</b><small>Reputation</small></div><div class="resultCell"><b>${state.contracts.filter(Boolean).length}/3</b><small>Contracts</small></div></div><p>${late?'The deadline passed, so the reputation reward was reduced.':'Delivered by the deadline. The guild is impressed.'} The next contract is now active.</p><div class="btnRow"><button class="cta" data-dismiss="1">Continue your quest</button></div>`)}
function finish(won){state.finished=true;const held=state.crew.length,morale=overallMorale(),delivered=state.contracts.filter(Boolean).length;const score=Math.round(delivered*310+state.rep*2.2+morale*1.1+held*16+state.totalWork*.21+Math.min(300,state.cash)*.20-(state.everRecruited-held)*27+state.caught.length*18);let best=0;try{best=+(localStorage.getItem(BEST)||'0');if(score>best)localStorage.setItem(BEST,String(score))}catch(e){}const newBest=score>best;save();const policyCounts={hard:0,soft:0,balanced:0};state.policyHistory.forEach(p=>policyCounts[p.policy]++);const adv=morale>=70?'Your workforce finished motivated and resilient.':morale<40?'Your focus on output left morale dangerously low.':'Your team kept producing, but motivation could be stronger.';overlay('end',`<div class="eyebrow">${won?'Expedition complete':'Season finished'} · Business debrief</div><h2>${won?'You built a thriving crew.':'Your season has ended.'}</h2><div style="display:flex;align-items:center;gap:17px;margin:16px 0"><div style="font:900 67px var(--display);color:var(--lime);letter-spacing:-4px">${score}</div><div><span class="pill green">${newBest?'NEW PERSONAL BEST':'QUEST SCORE'}</span><p style="margin:7px 0 0">${delivered}/3 contracts · ${held} retained · ${state.caught.length}/${types.length} species bonded</p></div></div><div class="results"><div class="resultCell"><b>${morale}%</b><small>Final morale</small></div><div class="resultCell"><b>${state.totalWork}</b><small>Total output</small></div><div class="resultCell"><b>${state.everRecruited-held}</b><small>Departures</small></div></div><p class="lead">${adv} The strongest motivator depended on the individual, while workforce policy changed the trade-off between short-term output, cost and longer-term welfare.</p><div class="tipBox">Policy days: ${policyCounts.hard} target-led · ${policyCounts.balanced} balanced · ${policyCounts.soft} supportive. Revisit the field journal to evaluate your HR choices.</div><div class="btnRow"><butto const spriteCache={};
function creatureSvg(t){const a=spriteArt[t.id]||spriteArt.mossbun;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 108" aria-label="${t.name}" role="img"><defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#071a22" flood-opacity=".28"/></filter></defs><g filter="url(#s)">${a}<ellipse cx="43" cy="49" rx="4.2" ry="5.4" fill="#1c3445"/><ellipse cx="61" cy="49" rx="4.2" ry="5.4" fill="#1c3445"/><circle cx="44" cy="47" r="1.4" fill="#fff"/><circle cx="62" cy="47" r="1.4" fill="#fff"/><path d="M47 60Q52 64 57 60" fill="none" stroke="#3f4e58" stroke-width="2.7" stroke-linecap="round"/></g></svg>`}
function cAvatar(t){return `<div class="avatar beastAvatar" style="background:radial-gradient(circle at 40% 15%,${t.color}7a,#15283e 74%);border-color:${BUSINESS_TYPES[t.btype].color}72">${creatureSvg(t)}</div>`}
function spriteImage(t){if(!spriteCache[t.id]){const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(creatureSvg(t));spriteCache[t.id]=img}return spriteCache[t.id]}
function drawCreature(g,x,y,t,scale=1,phase=0){g.save();g.translate(x,y+Math.sin(elapsed*2.2+phase)*2);g.scale(scale,scale);g.fillStyle='#0b273951';g.beginPath();g.ellipse(0,15,19,6,0,0,7);g.fill();const img=spriteImage(t);if(img.complete&&img.naturalWidth)g.drawImage(img,-25,-37,50,54);else{g.fillStyle=t.color;g.beginPath();g.ellipse(0,-6,14,18,0,0,7);g.fill()}g.restore()}
function typePill(type){const t=BUSINESS_TYPES[type];return `<span class="typePill" style="--type:${t.color}"><b>${t.icon}</b> ${t.name}</span>`}
function makeCrew(typeId){const t=species(typeId);return{id:Math.floor(Math.random()*1e9),species:typeId,name:names[Math.floor(Math.random()*names.length)],morale:78,energy:90,trust:70,stats:{...t.base},contractsWon:0,role:t.role,boost:0,tenure:0,trained:0,rewarded:0}}
function fresh(){return {version:2,seed:Math.floor(Math.random()*999999),day:1,cash:190,rep:25,crew:[],resources:{grove:0,forge:0,scout:0},contractsDone:{},contractHistory:[],pending:[],battleWins:{},battleAttempts:{},battle:null,actionsLeft:3,policy:'balanced',policyHistory:[],logs:[{day:1,msg:'Contracts and rival battles are available now. Recruit, deploy, maintain morale and grow your crew.'}],wild:[],pickups:[],used:{},player:{x:17.2,y:19.2},message:'Catch monsters, send them on jobs, and challenge rival crews.',totalWork:0,failed:0,everRecruited:0,finished:false,shownTutorial:false,played:0,seen:[],caught:[],showAllContracts:false}}
function load(){try{const data=JSON.parse(localStorage.getItem(SAVE)||'null');if(!data||![1,2].includes(data.version)||!data.player||!Array.isArray(data.crew))return false;state=data;state.version=2;state.contractsDone=state.contractsDone||{};state.contractHistory=state.contractHistory||[];state.pending=state.pending||[];state.battleWins=state.battleWins||{};state.battleAttempts=state.battleAttempts||{};state.battle=state.battle?.result?null:(state.battle||null);state.policyHistory=state.policyHistory||[];state.used=state.used||{};state.logs=state.logs||[];state.seen=state.seen||[];state.caught=state.caught||[];state.wild=state.wild||[];state.pickups=state.pickups||[];state.showAllContracts=false;state.crew.forEach(c=>{c.stats=c.stats||{...species(c.species).base};c.contractsWon=c.contractsWon||0;c.boost=c.boost||0;c.morale=clamp(c.morale,0,100);c.energy=clamp(c.energy,0,100);c.trust=clamp(c.trust,0,100)});if(!state.wild.length)createWild();if(!state.pickups.length)createPickups();save();return true}catch(e){return false}}
function effectiveStat(c,s){return Math.round((c.stats?.[s]??species(c.species).base[s])*clamp(c.morale,0,100)/100)}
function liveStatBars(c){return Object.keys(STAT_NAMES).map(k=>{const b=c.stats[k],v=effectiveStat(c,k);return `<div class="attributeRow"><span>${STAT_NAMES[k]}</span><div class="attrTrack"><i style="width:${Math.min(100,b/55*100)}%;--type:${BUSINESS_TYPES[species(c.species).btype].color}"></i><em style="left:${Math.min(100,v/55*100)}%"></em></div><strong>${v}<small>/${b}</small></strong></div>`}).join('')}
function busyCrewIDs(){return new Set(state.pending.flatMap(p=>p.teamIds))}
function availableForWork(){const busy=busyCrewIDs();return state.crew.filter(c=>!busy.has(c.id))}
function dailyContracts(){const day=state.day;const arr=[{id:'gig-'+day+'-a',name:['Local Pop-Up','Urgent Order','Quick Consultancy','Neighbourhood Campaign'][day%4],min:1,preferred:['synergy','hustle','beancounter','hype'][day%4],stat:['spirit','power','focus','speed'][day%4],difficulty:17+Math.floor(day*1.7),reward:45+day*8,rep:3+Math.floor(day/2),desc:'A rotating opportunity, available only today.',unlock:day}];if(day>=5)arr.push({id:'gig-'+day+'-b',name:['Emergency Audit','Talent Showcase','Late-Stage Pivot'][day%3],min:2,preferred:['redtape','hype','disruptor'][day%3],stat:['guard','focus','speed'][day%3],difficulty:20+Math.floor(day*1.7),reward:74+day*10,rep:5+Math.floor(day/2),desc:'An extra daily opportunity for a larger crew.',unlock:day});return arr}
function allContracts(){return [...CONTRACTS_V2,...dailyContracts()]}
function contractById(id){return allContracts().find(c=>c.id===id)}
function contractChance(job,ids){const group=ids.map(id=>state.crew.find(c=>c.id===id)).filter(Boolean);if(group.length<job.min)return 0;const quality=group.reduce((sum,c)=>sum+effectiveStat(c,job.stat)*.70+effectiveStat(c,'spirit')*.25+effectiveStat(c,'speed')*.12+(c.boost||0)*16,0)/group.length;const right=group.filter(c=>species(c.species).btype===job.preferred).length;const cohesion=group.length>1?Math.round(group.reduce((n,c)=>n+c.trust,0)/group.length/14):0;const expanded=(group.length-job.min)*8;return clamp(Math.round(55+(quality-job.difficulty)*2.1+right*14+cohesion+expanded),12,96)}
function contractStage(d){return d<3?1:d<5?2:d<8?3:4}
function currentContractPool(){const done=state.contractsDone,pending=new Set(state.pending.map(p=>p.id));return allContracts().filter(c=>c.unlock<=state.day&&!done[c.id]&&!pending.has(c.id)).sort((a,b)=>b.unlock-a.unlock||a.min-b.min)}
function dispatchContract(id,ids){const job=contractById(id);if(!job||job.unlock>state.day||state.contractsDone[id]||state.pending.some(p=>p.id===id))return false;const free=new Set(availableForWork().map(c=>c.id));if(ids.length<job.min||ids.length>3||new Set(ids).size!==ids.length||ids.some(v=>!free.has(v)))return false;const chance=contractChance(job,ids);state.pending.push({id,day:state.day,teamIds:[...ids],chance,job:{...job}});log(`${ids.map(v=>state.crew.find(c=>c.id===v)?.name).join(' + ')} dispatched on ${job.name} (${chance}% estimated success).`);renderSide();save();return true}
function contractCard(c){const pending=state.pending.find(p=>p.id===c.id),done=state.contractsDone[c.id];return `<div class="jobCard ${pending?'jobPending':''}"><div class="contractHead"><div><b>${c.name}</b><div class="tiny">${c.min}–3 crew · ${STAT_NAMES[c.stat]} · ${typePill(c.preferred)}</div></div><span class="pill ${pending?'orange':done?'green':''}">${pending?'OUT':done?'DONE':c.reward+' cr'}</span></div><p>${c.desc}</p><div class="jobBottom"><span>+${c.rep} rep · ${c.min} required · Growth on success</span>${pending?'<b class="tiny">Returns at camp</b>':done?'<b class="tiny">Complete</b>':`<button class="smallCta" data-contract="${c.id}">Assign crew</button>`}</div></div>`}
function guildPanel(){const choices=currentContractPool();const items=state.showAllContracts?choices:choices.slice(0,6);return `<div class="sectionTitle"><h2>Contract board</h2><small>${state.contractHistory.filter(h=>h.success).length} won</small></div><div class="boardStats"><div><b>${state.pending.length}</b><small>Out today</small></div><div><b>${state.crew.length-busyCrewIDs().size}</b><small>Available</small></div><div><b>Stage ${contractStage(state.day)}</b><small>Day ${state.day<=10?state.day:'ended'}</small></div></div>${state.pending.length?`<div class="miniTitle">Sent today</div>${state.pending.map(p=>`<div class="pendingRow"><b>${p.job.name}</b><span>${p.chance}% chance</span></div>`).join('')}`:''}<div class="miniTitle">Available contracts</div>${items.length?items.map(contractCard).join(''):'<div class="tipBox">No contracts currently available. End the day to unlock more opportunities.</div>'}${choices.length>6?`<button class="ghost wideBtn" data-all-contracts="1">${state.showAllContracts?'Show fewer':'View all '+choices.length+' contracts'}</button>`:''}<p class="footNote">You can send monsters from anywhere from Day 1. Each monster can take one contract per day. Assignments resolve when you finish the day at Base Camp; only success grows permanent attributes.</p>`}
function crewPanel(){const c=state.crew[selected],t=c?species(c.species):null,busy=busyCrewIDs();return `<div class="sectionTitle"><h2>Monster crew</h2><small>${state.crew.length}/6</small></div>${state.crew.length?`<div class="compactCrew">${state.crew.map((v,i)=>{const sp=species(v.species);return `<button class="creatureCard ${i===selected?'selected':''}" data-select="${i}">${cAvatar(sp)}<div><span class="cName">${v.name}</span><span class="cMeta">${sp.name} · ${BUSINESS_TYPES[sp.btype].name}</span></div><div class="cSide"><b>${Math.round(v.morale)}%</b><div class="meter ${v.morale<50?'pink':''}"><i style="width:${Math.round(v.morale)}%"></i></div></div></button>`}).join('')}</div>`:'<div class="tipBox">Approach a wandering monster, press E, make a recruitment offer and time the trust pulse.</div>'}${c?`<div class="detail"><div class="detailTitle">${cAvatar(t)}<div><h3>${c.name}</h3>${typePill(t.btype)} <span class="pill ${busy.has(c.id)?'orange':'green'}">${busy.has(c.id)?'On contract':'Available'}</span><div class="tiny">${t.name} · ${c.contractsWon} successful contract${c.contractsWon===1?'':'s'}</div></div></div><div class="moraleScore"><b>${Math.round(c.morale)}% morale</b><span>All five live stats × ${(c.morale/100).toFixed(2)}</span></div><div class="attributes">${liveStatBars(c)}</div><div class="crewMini"><span>Energy ${c.energy}%</span><span>Trust ${c.trust}%</span><span>Motivator: ${cNeed(t.need)}</span></div><div class="roleBtns">${Object.keys(ROLE).map(r=>`<button data-assign="${r}" class="${c.role===r?'active':''}">${ROLE[r].short}</button>`).join('')}</div><div class="quickRow"><button class="smallCta" data-goto="guild">Send on contract</button><button class="ghost" data-goto="hr">Maintain morale</button></div><p class="footNote">Grey number = base stat; bright number = current effective stat. Battle victories do not increase base stats.</p></div>`:''}${state.crew.length>=6?'<p class="footNote">Crew full: arrange a sanctuary transfer at the HR desk to recruit another creature.</p>':''}`}
function hrPanel(){const c=state.crew[selected],p=state.policy;return `<div class="sectionTitle"><h2>HR desk</h2><small>${state.actionsLeft} actions left</small></div><div class="controlBox"><h3>Management approach</h3><div class="policyBtns"><button class="${p==='hard'?'active':''}" data-policy="hard">Hard</button><button class="${p==='balanced'?'active':''}" data-policy="balanced">Mixed</button><button class="${p==='soft'?'active':''}" data-policy="soft">Soft</button></div><p style="margin:8px 0 0">${policyDescription(p)}</p></div>${c?`<div class="carePanel"><div class="contractHead"><b>Morale maintenance</b><small>${c.name}: ${Math.round(c.morale)}%</small></div><p>Buy support to restore performance immediately. At 50% morale, all five stats work at 50% of base.</p><div class="careRow"><button data-care="snack" ${state.cash<14?'disabled':''}>Care pack <b>14 cr</b><small>+16 morale</small></button><button data-care="personal" ${state.cash<27?'disabled':''}>Tailored support <b>27 cr</b><small>+30 morale</small></button></div><button class="ghost wideBtn" data-care="team" ${state.cash<46?'disabled':''}>Crew wellbeing day · 46 credits · +13 to everyone</button></div><div class="miniTitle">Motivation techniques <span class="tiny">· ${c.name}</span></div><div class="actionGrid">${actions.map(a=>`<button class="action" data-hr="${a.id}" ${state.actionsLeft<=0||state.cash<a.cost?'disabled':''}><b>${a.name}</b><span>${a.label}</span><em>${a.cost?a.cost+' credits':'Free'}</em></button>`).join('')}</div><p class="footNote">Training, enrichment and target-setting can boost readiness temporarily; <b>permanent stats grow only on successful contracts</b>.</p><button class="ghost wideBtn" data-transfer="1">Arrange sanctuary transfer</button>`:'<div class="tipBox">Recruit your starter to begin workforce management.</div>'}<button class="cta wide" data-rest="1">End day at Base Camp</button>`}
function battlePanel(){const unlocked=RIVALS.filter(r=>r.unlock<=state.day),busy=busyCrewIDs();return `<div class="sectionTitle"><h2>Rival arena</h2><small>${Object.values(state.battleWins).filter(Boolean).length}/${RIVALS.length} crews beaten</small></div><div class="tipBox">Build a three-monster line-up and challenge rival crews. Battles earn credits and reputation; <b>only contracts upgrade base stats</b>.</div><div class="miniTitle">Type advantage</div><div class="matchupStrip">${Object.entries(BUSINESS_TYPES).map(([id,v])=>`<span style="color:${v.color}" title="${v.name} beats ${BUSINESS_TYPES[v.beats].name}">${v.name} › ${BUSINESS_TYPES[v.beats].name}</span>`).join('')}</div><div class="miniTitle">Rival crews</div>${RIVALS.map(r=>`<div class="rivalCard ${r.unlock>state.day?'locked':''}"><div class="contractHead"><div><b>${r.name}</b><div class="tiny">${r.title} · ${r.team.length} monsters · Day ${r.unlock}</div></div><span class="pill ${state.battleWins[r.id]?'green':r.unlock>state.day?'':'orange'}">${state.battleWins[r.id]?'BEATEN':r.unlock>state.day?'LOCKED':r.reward+' cr'}</span></div><p>${r.desc}</p><div class="rivalBottom"><div class="rivalFaces">${r.team.map(id=>cAvatar(species(id))).join('')}</div><button class="smallCta" data-rival="${r.id}" ${r.unlock>state.day||state.day>10||(!state.crew.length)||state.battleAttempts[r.id]===state.day||state.battle?'disabled':''}>${state.battleAttempts[r.id]===state.day?'Played today':'Challenge'}</button></div></div>`).join('')}<p class="footNote">Rivals unlock on Days 1, 3, 5, 7 and 9. Defeated rivals can be challenged again on a later day for a smaller reward. Busy monsters cannot battle.</p>${busy.size?`<p class="footNote">${busy.size} monster${busy.size===1?' is':'s are'} currently dispatched.</p>`:''}`}
function journalPanel(){return `<div class="sectionTitle"><h2>Field journal</h2><small>Campaign evidence</small></div><div class="boardStats"><div><b>${state.contractHistory.filter(h=>h.success).length}</b><small>Contracts won</small></div><div><b>${Object.values(state.battleWins).filter(Boolean).length}</b><small>Rivals beaten</small></div><div><b>${state.caught.length}/${types.length}</b><small>Species</small></div></div><div class="btnRow compactActions"><button class="ghost" data-open="codex">Business type guide</button><button class="ghost" data-export="1">Export debrief</button></div><details class="controlBox"><summary>Creature collection</summary><div class="collectionGrid">${types.map(t=>`<div style="text-align:center;opacity:${state.seen.includes(t.id)?1:.27}">${cAvatar(t)}<div class="tiny">${state.seen.includes(t.id)?t.name:'???'}</div><div class="tiny" style="color:var(--lime)">${state.caught.includes(t.id)?'CAUGHT':state.seen.includes(t.id)?'SEEN':'UNKNOWN'}</div></div>`).join('')}</div></details><div class="miniTitle">Decision history</div>${state.logs.slice(0,26).map(l=>`<div class="journalRow"><span class="hintTag">Day ${l.day}</span><div>${l.msg}</div></div>`).join('')}`}
function renderSide(){if(!state)return;const el=$('#sideContent');el.innerHTML=activeTab==='crew'?crewPanel():activeTab==='guild'?guildPanel():activeTab==='battle'?battlePanel():activeTab==='hr'?hrPanel():journalPanel();updateHud()}
function tab(name){activeTab=name;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));renderSide()}
function updateHud(){ $('#hudDay').textContent=`Day ${Math.min(state.day,10)} / 10`;$('#hudCash').textContent=state.cash;$('#hudRep').textContent=state.rep;$('#hudMorale').textContent=state.crew.length?overallMorale()+'%':'—';$('#hudMorale').className=overallMorale()<45?'alert':'';const zz=zones[zone(state.player.x,state.player.y)];$('#biomeName').textContent=zz[0];$('#biomeCaption').textContent=zz[1]}
function policyDescription(p){return{hard:'Hard HRM: +20% independent output, low wage costs, but −12 morale and faster fatigue per day.',balanced:'Mixed HRM: ordinary wages and moderate fatigue, with −5 morale per day.',soft:'Soft HRM: 15 credits per day, stronger trust, +5 morale and slower fatigue.'}[p]}
function runAction(id){const a=actions.find(v=>v.id===id),c=state.crew[selected];if(!a||!c||state.actionsLeft<=0||state.cash<a.cost)return;const motive={bonus:'pay',recognition:'recognition',training:'growth',empower:'autonomy',team:'belonging',wellbeing:'security',stretch:'achievement',rotate:'growth'}[id],match=species(c.species).need===motive,m=match?1.6:1;state.cash-=a.cost;state.actionsLeft--;let change='';switch(id){case'bonus':c.morale=clamp(c.morale+Math.round(13*m),0,100);c.trust=clamp(c.trust+5,0,100);change='Financial reward increased morale.';break;case'recognition':c.morale=clamp(c.morale+Math.round(11*m),0,100);c.trust=clamp(c.trust+6,0,100);change='Recognition lifted morale and trust.';break;case'training':c.morale=clamp(c.morale+Math.round(7*m),0,100);c.energy=clamp(c.energy-8,0,100);c.boost=(c.boost||0)+.20;change='Training increased readiness for the next contract, not permanent stats.';break;case'empower':c.morale=clamp(c.morale+Math.round(9*m),0,100);c.trust=clamp(c.trust+10,0,100);c.boost=(c.boost||0)+.10;change='Autonomy increased morale, trust and readiness.';break;case'team':state.crew.forEach(v=>v.morale=clamp(v.morale+3,0,100));c.morale=clamp(c.morale+Math.round(8*m),0,100);c.trust=clamp(c.trust+8,0,100);change='The team strengthened its social bonds.';break;case'wellbeing':c.energy=clamp(c.energy+32,0,100);c.morale=clamp(c.morale+Math.round(7*m),0,100);c.trust=clamp(c.trust+5,0,100);change='Energy and welfare recovered.';break;case'stretch':c.boost=(c.boost||0)+(match?.28:.15);c.energy=clamp(c.energy-12,0,100);c.morale=clamp(c.morale-(match?0:6),0,100);change='A free short-term performance target, but no free morale improvement.';break;case'rotate':c.boost=(c.boost||0)+.15;c.morale=clamp(c.morale+Math.round(6*m),0,100);change='Job enrichment improved temporary readiness and engagement.';break}log(`${c.name}: ${a.name}. ${change}${match?' A strong fit to individual motivation.':''}`);renderSide();overlay('feedback',`<div class="eyebrow">Motivation decision · ${a.label}</div><h2>${a.name}</h2><p class="lead">${change}</p><div class="tipBox"><b>Business link:</b> ${a.theory}</div><div class="btnRow"><button class="cta" data-dismiss="1">Continue</button></div>`)}
function buyCare(kind){if(state.finished)return;const c=state.crew[selected],cfg={snack:{cost:14,gain:16},personal:{cost:27,gain:30},team:{cost:46,gain:13}}[kind];if(!c||!cfg||state.cash<cfg.cost)return;state.cash-=cfg.cost;if(kind==='team')state.crew.forEach(v=>v.morale=clamp(v.morale+cfg.gain,0,100));else c.morale=clamp(c.morale+cfg.gain,0,100);log(`${kind==='team'?'Whole crew':c.name} received paid ${kind==='team'?'wellbeing support':kind==='personal'?'tailored support':'care'}: −${cfg.cost} credits, +${cfg.gain} morale${kind==='team'?' each':''}.`);renderSide()}
function useNpcChoice(index){const id=modalContext?.npc,scene=npcScenes[id],v=scene?.choices[index];if(!v)return;if((v.money||0)<0&&state.cash<-(v.money||0))return showToast('Not enough credits for this intervention.');state.used[id+'-'+state.day]=true;state.cash+=(v.money||0);state.rep=clamp(state.rep+(v.rep||0),0,100);state.crew.forEach(c=>{c.morale=clamp(c.morale+(v.morale||0),0,100);c.energy=clamp(c.energy+(v.energy||0),0,100);c.boost+=(v.boost||0)+(v.skill?.13:0)});log(`${pois.find(p=>p.id===id).name}: ${v.label}. ${v.result}`);renderSide();overlay('npcResult',`<div class="eyebrow">Consequences · ${scene.tag}</div><h2>${v.label}</h2><p class="lead">${v.result}</p><div class="tipBox"><b>Business link:</b> ${v.concept} Skills from training are temporary readiness; base attributes rise only on successful contracts.</div><div class="btnRow"><button class="cta" data-dismiss="1">Return to exploration</button></div>`)}
function openContract(id){const job=contractById(id);if(!job)return;modalContext={contractId:id,teamIds:[]};showContractModal()}
function showContractModal(){const job=contractById(modalContext?.contractId);if(!job)return;const chosen=modalContext.teamIds,free=availableForWork(),chance=contractChance(job,chosen);overlay('contract',`<div class="eyebrow">Contract dispatch · Day ${state.day}</div><h2>${job.name}</h2><p class="lead">${job.desc}</p><div class="results"><div class="resultCell"><b>${job.reward}</b><small>Credits if successful</small></div><div class="resultCell"><b>${job.min}–3</b><small>Team size</small></div><div class="resultCell"><b>${chance||'—'}${chance?'%':''}</b><small>Success estimate</small></div></div><div class="tipBox">Priority: <b>${STAT_NAMES[job.stat]}</b> · Best fit: ${typePill(job.preferred)} · If the job succeeds, each assigned monster gains <b>+2 ${STAT_NAMES[job.stat]} and +1 Spirit or Power</b>.</div><div class="miniTitle">Choose ${job.min}–3 available monsters (${chosen.length} selected)</div><div class="rosterPicker">${free.length?free.map(c=>`<button data-contract-select="${c.id}" class="pickCrew ${chosen.includes(c.id)?'picked':''}">${cAvatar(species(c.species))}<span><b>${c.name}</b><small>${BUSINESS_TYPES[species(c.species).btype].name} · ${Math.round(c.morale)}% morale</small><small>${STAT_NAMES[job.stat]} ${effectiveStat(c,job.stat)}/${c.stats[job.stat]}</small></span><em>${chosen.includes(c.id)?'✓':'+'}</em></button>`).join(''):'<p>No available monsters. Complete today’s dispatches first.</p>'}</div><div class="btnRow"><button class="cta" data-contract-go="1" ${chosen.length<job.min?'disabled':''}>Send on contract</button><button class="ghost" data-dismiss="1">Cancel</button></div>`,true,true)}
function toggleContractCrew(id){if(modalType!=='contract')return;const job=contractById(modalContext?.contractId);if(!job||!availableForWork().some(c=>c.id===id))return;const arr=modalContext.teamIds;if(arr.includes(id))modalContext.teamIds=arr.filter(x=>x!==id);else if(arr.length<3)arr.push(id);showContractModal()}
function completeContracts(){const result=[];for(const p of state.pending){const job=p.job,ids=p.teamIds,group=ids.map(id=>state.crew.find(c=>c.id===id)).filter(Boolean);if(!group.length)continue;const chance=contractChance(job,ids),success=Math.random()*100<chance;const row={id:job.id,name:job.name,day:state.day,success,chance,team:group.map(c=>c.name),teamIds:group.map(c=>c.id),reward:success?job.reward:0};state.contractHistory.push(row);if(success){state.contractsDone[job.id]=true;state.cash+=job.reward;state.rep=clamp(state.rep+job.rep,0,100);state.totalWork+=job.reward;group.forEach(c=>{c.contractsWon++;c.stats[job.stat]=Math.min(65,c.stats[job.stat]+2);const extra=job.stat==='spirit'?'power':'spirit';c.stats[extra]=Math.min(65,c.stats[extra]+1);c.trust=clamp(c.trust+2,0,100)});log(`${job.name} succeeded (+${job.reward} cr, +${job.rep} rep). ${group.map(c=>c.name).join(', ')} gained permanent contract attributes.`)}else{state.rep=clamp(state.rep-1,0,100);group.forEach(c=>{c.morale=clamp(c.morale-5,0,100);c.energy=clamp(c.energy-8,0,100)});log(`${job.name} failed (${chance}% forecast). No permanent attribute increase; crew morale fell.`)}group.forEach(c=>{c.energy=clamp(c.energy-13,0,100);c.boost=0});result.push(row)}state.pending=[];return result}
function dayAdvance(){if(state.day>10||state.finished)return;if(!state.crew.length){overlay('note','<h2>Recruit a monster first</h2><p>A crew is needed to complete contracts or produce goods.</p><button class="cta" data-dismiss="1">Explore</button>');return}const pastDay=state.day;const contractResults=completeContracts();let output={grove:0,forge:0,scout:0},departed=[];const pol=state.policy;const policyFee=pol==='soft'?15:0;for(const c of [...state.crew]){const t=species(c.species);if(!contractResults.some(r=>r.teamIds.includes(c.id))){const fit=c.role===t.role?1.17:.83,live=(effectiveStat(c,'power')+effectiveStat(c,'focus')+effectiveStat(c,'spirit'))/3;const units=Math.max(0,Math.round(live*.52*fit*(pol==='hard'?1.2:pol==='soft'?1.08:1)*(1+(c.boost||0))));output[c.role]+=units;state.totalWork+=units;c.energy=clamp(c.energy-(pol==='hard'?20:pol==='soft'?12:15),0,100)}c.tenure++;if(pol==='hard'){c.morale=clamp(c.morale-12,0,100);c.energy=clamp(c.energy-9,0,100);c.trust=clamp(c.trust-5,0,100)}else if(pol==='soft'&&state.cash>=policyFee){c.morale=clamp(c.morale+5,0,100);c.trust=clamp(c.trust+3,0,100)}else{c.morale=clamp(c.morale-5,0,100);c.trust=clamp(c.trust-1,0,100)}if(c.energy<18)c.morale=clamp(c.morale-7,0,100);c.energy=clamp(c.energy+10,0,100);c.boost=0;if(c.morale<14||c.trust<10){if(Math.random()<.45){departed.push(c.name);state.crew=state.crew.filter(v=>v.id!==c.id);state.rep=clamp(state.rep-6,0,100)}}}const revenue=Math.round(output.grove*.48+output.forge*.59+output.scout*.51);const wages=state.crew.length*(pol==='hard'?4:pol==='soft'?9:7);const welfare=pol==='soft'&&state.cash>=policyFee?policyFee:0;state.cash=Math.max(0,state.cash+revenue-wages-welfare);state.resources.grove+=output.grove;state.resources.forge+=output.forge;state.resources.scout+=output.scout;state.policyHistory.push({day:pastDay,policy:pol,output:output.grove+output.forge+output.scout,morale:overallMorale(),cash:state.cash,departed:departed.length});log(`Day ${pastDay}: ${contractResults.filter(r=>r.success).length}/${contractResults.length} contracts succeeded; ${revenue} background revenue, ${wages} wages${welfare?', '+welfare+' welfare':''}.`);if(departed.length)log(`${departed.join(', ')} left due to low morale or trust.`);state.day++;state.actionsLeft=3;state.used={};state.battle=null;selected=clamp(selected,0,Math.max(0,state.crew.length-1));if(state.day<=10){createWild();createPickups()}save();renderSide();const lines=contractResults.map(r=>`<div class="dayOutcome"><span class="pill ${r.success?'green':'pink'}">${r.success?'SUCCESS':'FAILED'}</span><b>${r.name}</b><small>${r.success?'+'+r.reward+' credits · permanent stat gains':'No growth · morale −5'}</small></div>`).join('');overlay('day',`<div class="eyebrow">Workday ${pastDay} · Results</div><h2>${contractResults.length?contractResults.filter(r=>r.success).length+' contract'+(contractResults.filter(r=>r.success).length===1?'':'s')+' completed':'A day of preparation'}</h2>${lines||'<p>No deployments today. Send monsters on the Contract board to gain permanent statistics.</p>'}<div class="results"><div class="resultCell"><b>${revenue}</b><small>Background income</small></div><div class="resultCell"><b>${wages+welfare}</b><small>Wages & welfare</small></div><div class="resultCell"><b>${overallMorale()}%</b><small>Team morale</small></div></div><p class="footNote">Successful contract crews gain +2 primary attribute and +1 secondary; battle victories never upgrade base stats. ${departed.length?'Departures: '+departed.join(', ')+'.':''}</p><div class="btnRow">${state.day>10?'<button class="cta" data-finale="1">View season results</button>':'<button class="cta" data-dismiss="1">Day '+state.day+': Keep playing</button><button class="ghost" data-goto="guild" data-dismiss="1">View new contracts</button>'}</div>`,true,true)}
function starterDraw(id){const t=species(id);return `<button class="choice" data-starter="${id}">${cAvatar(t)}<strong>${t.name}</strong>${typePill(t.btype)}<span>${t.desc}</span><small>${cNeed(t.need)} · ${STAT_NAMES[Object.keys(t.base).sort((a,b)=>t.base[b]-t.base[a])[0]]} specialist</small></button>`}
function welcome(hasSave){overlay('start',`<div class="eyebrow">Catch · contract · compete</div><h2>Build your crew.<br>Grow your business.</h2><div class="startArt">${cAvatar(types[0])}${cAvatar(types[3])}${cAvatar(types[2])}</div><p class="lead">Catch creatures with different business strengths, dispatch them on contracts from Day 1, and battle rival crews. Pay to maintain morale: at 50% morale, stats operate at 50%.</p><div class="results"><div class="resultCell"><b>12</b><small>Original creatures</small></div><div class="resultCell"><b>19+</b><small>Contracts</small></div><div class="resultCell"><b>5</b><small>Rival crews</small></div></div><div class="btnRow">${hasSave?'<button class="cta" data-start="continue">Continue</button><button class="ghost" data-start="new">New season</button>':'<button class="cta" data-start="new">Play now</button>'}<button class="ghost" data-open="help">Controls</button></div>`,false,true)}
function starters(){overlay('starter',`<div class="eyebrow">Choose your first business partner</div><h2>Pick a starter</h2><p>Each has a different business type and strength. You can start sending them on contracts immediately.</p><div class="choiceGrid">${['mossbun','voltusk','glimmeray'].map(starterDraw).join('')}</div>`,false,true)}
function help(){overlay('help',`<div class="eyebrow">Quick-start handbook</div><h2>Play the business</h2><div class="results"><div class="resultCell"><b>WASD</b><small>Move</small></div><div class="resultCell"><b>E</b><small>Interact</small></div><div class="resultCell"><b>1–5</b><small>Game panels</small></div></div><p><b>Catch:</b> approach a wild monster, press E, choose a motivational offer and press Space to stop the trust needle.</p><p><b>Contract:</b> open Contracts from anywhere, choose a job and assign 1–3 available monsters. Finish the day at Base Camp to resolve it. Only successes increase permanent attributes.</p><p><b>Battle:</b> visit the Rival Arena or use Battle. Select up to three monsters, choose attacks, guard or switch when needed. Business types have strategic advantages.</p><p><b>Maintain morale:</b> buy support at the HR desk. All five combat and contract stats scale directly with morale, so 50% morale means 50% effective stats.</p><p class="tiny">SHIFT sprint · Save uses this browser · Mobile movement pad available · Monsters sent on contracts cannot also battle until the next day.</p><div class="btnRow"><button class="cta" data-dismiss="1">Back to game</button><button class="ghost" data-open="codex">Business type guide</button></div>`,true,true)}
function codex(){overlay('codex',`<div class="eyebrow">MonsterWorks · Business field guide</div><h2>Six business types</h2><div class="typeGuide">${Object.entries(BUSINESS_TYPES).map(([id,t])=>`<div class="typeGuideRow">${typePill(id)}<div><b>${t.tag}</b><small>${t.desc} Beats ${BUSINESS_TYPES[t.beats].name}; loses to ${Object.values(BUSINESS_TYPES).find(a=>a.beats===id).name}.</small></div></div>`).join('')}</div><div class="miniTitle">Why the HR decisions matter</div><p><b>Taylor:</b> financial rewards. <b>Mayo:</b> relationships. <b>Maslow:</b> welfare and security. <b>Herzberg:</b> recognition and meaningful work. <b>McClelland:</b> achievement. <b>Vroom:</b> expected outcomes. Hard HRM may improve immediate output while reducing morale; soft HRM costs more but supports commitment. These are simplified classroom mechanisms, not predictions about real workers.</p><div class="btnRow"><button class="cta" data-dismiss="1">Close guide</button></div>`,true,true)}
function selectBattleRival(id){const r=RIVALS.find(x=>x.id===id);if(!r||r.unlock>state.day||state.battleAttempts[id]===state.day||state.battle)return;modalContext={rivalId:id,teamIds:[]};showBattlePicker()}
function showBattlePicker(){const r=RIVALS.find(x=>x.id===modalContext?.rivalId);if(!r)return;const busy=busyCrewIDs(),free=state.crew.filter(c=>!busy.has(c.id));overlay('battlePicker',`<div class="eyebrow">Rival arena · ${r.title}</div><h2>${r.name}</h2><p>${r.desc}</p><div class="battlePreview">${r.team.map(id=>cAvatar(species(id))).join('')}<div>Win: <b>${r.reward} credits</b> · +${r.rep} reputation. No permanent stat rewards.</div></div><div class="miniTitle">Choose 1–3 available battlers (${modalContext.teamIds.length} selected)</div><div class="rosterPicker">${free.map(c=>`<button data-battle-select="${c.id}" class="pickCrew ${modalContext.teamIds.includes(c.id)?'picked':''}">${cAvatar(species(c.species))}<span><b>${c.name}</b><small>${BUSINESS_TYPES[species(c.species).btype].name} · Morale ${Math.round(c.morale)}%</small><small>Power ${effectiveStat(c,'power')} · Guard ${effectiveStat(c,'guard')}</small></span><em>${modalContext.teamIds.includes(c.id)?'✓':'+'}</em></button>`).join('')||'<p>Every monster is out on contract.</p>'}</div><div class="btnRow"><button class="cta" data-battle-go="1" ${!modalContext.teamIds.length?'disabled':''}>Enter the arena</button><button class="ghost" data-dismiss="1">Leave</button></div>`,true,true)}
function battleMaxHp(f){return Math.max(8,Math.round((56+f.base.guard*1.15+f.base.spirit*.55)*f.morale/100))}
function startBattle(id,teamIds){const r=RIVALS.find(v=>v.id===id),busy=busyCrewIDs();if(!r||!teamIds.length||teamIds.length>3||teamIds.some(v=>busy.has(v)||!state.crew.some(c=>c.id===v)))return;const own=teamIds.map(cid=>{const c=state.crew.find(v=>v.id===cid),f={name:c.name,species:c.species,crewId:cid,base:{...c.stats},morale:c.morale,extraMorale:0,hp:0,maxHp:0,ward:0,sp:2};f.maxHp=battleMaxHp(f);f.hp=f.maxHp;return f});const enemy=r.team.map((sid,i)=>{const t=species(sid),base=Object.fromEntries(Object.entries(t.base).map(([k,v])=>[k,v+Math.floor(r.unlock/2)+i]));const f={name:t.name,species:sid,base,morale:r.morale,extraMorale:0,hp:0,maxHp:0,ward:0,sp:2};f.maxHp=battleMaxHp(f);f.hp=f.maxHp;return f});state.battle={rivalId:id,own,enemy,round:1,log:[`The ${r.name} are ready. Pick an action.`],result:null};state.battleAttempts[id]=state.day;save();renderBattle()}
function battlerStat(f,k){return Math.round(f.base[k]*clamp(f.morale+(f.extraMorale||0),0,100)/100)}
function battlerType(f){return species(f.species).btype}
function advantage(a,d){const atk=battlerType(a),def=battlerType(d);return BUSINESS_TYPES[atk].beats===def?1.30:BUSINESS_TYPES[def].beats===atk?.80:1}
function activeFighter(side){return state.battle?.[side].find(f=>f.hp>0)}
function battleHit(a,d,kind){const special=kind==='signature',power=special?battlerStat(a,'focus')*.95+battlerStat(a,'power')*.35:battlerStat(a,'power')*1.05+battlerStat(a,'speed')*.15;const defence=battlerStat(d,'guard')*.31;const critical=Math.random()<battlerStat(a,'focus')/300;let amount=Math.round(Math.max(3,(power+7-defence)*(special?1.13:.91)*advantage(a,d)*(critical?1.5:1)));if(d.ward)amount=Math.max(2,Math.floor(amount*.45));d.hp=Math.max(0,d.hp-amount);d.ward=0;return {damage:amount,crit:critical,adv:advantage(a,d)}}
function battleEnd(won){const b=state.battle,r=RIVALS.find(v=>v.id===b.rivalId),first=!state.battleWins[r.id];if(won){state.cash+=first?r.reward:Math.round(r.reward*.42);state.rep=clamp(state.rep+(first?r.rep:Math.round(r.rep*.45)),0,100);state.battleWins[r.id]=true;log(`${r.name} defeated: +${first?r.reward:Math.round(r.reward*.42)} credits, +${first?r.rep:Math.round(r.rep*.45)} rep. No permanent stats gained.`)}else{log(`Lost to ${r.name}. Improve contract attributes and morale before your next challenge.`)}for(const f of b.own){const c=state.crew.find(v=>v.id===f.crewId);if(c){c.energy=clamp(c.energy-(won?7:11),0,100);if(!won)c.morale=clamp(c.morale-5,0,100)}}b.result=won?'win':'loss';save();renderSide();overlay('battleEnd',`<div class="eyebrow">${r.title} · ${won?'Victory!':'Defeat'}</div><h2>${won?'Rival crew beaten!':'The rivals win this round'}</h2><div class="startArt">${(won?b.own:b.enemy).slice(0,3).map(v=>cAvatar(species(v.species))).join('')}</div><p class="lead">${won?`Your tactical choices earned ${first?r.reward:Math.round(r.reward*.42)} credits and ${first?r.rep:Math.round(r.rep*.45)} reputation.`:'Your crew needs a stronger match-up, higher morale or better contract-earned attributes.'}</p><div class="tipBox">Battles <b>never</b> increase permanent attributes. ${won?'Spend the rewards on morale upkeep and recruit another type to strengthen your line-up.':'Use the Contract board to grow your monsters permanently.'}</div><div class="btnRow"><button class="cta" data-battle-close="1">Back to the world</button><button class="ghost" data-goto="guild" data-battle-close="1">Contracts</button></div>`,true,true)}
function battleMove(kind){const b=state.battle;if(!b||b.result)return;const a=activeFighter('own'),d=activeFighter('enemy');if(!a||!d)return;let message='';if(kind==='signature'&&a.sp<1)return showToast('Not enough focus points. Quick Pitch restores one.');if(kind==='signature')a.sp--;if(kind==='quick'){a.sp=clamp(a.sp+1,0,3);const h=battleHit(a,d,'quick');message=`${a.name} used Quick Pitch: ${h.damage} damage${h.adv>1?' (type advantage!)':''}${h.crit?' · critical!':''}.`}else if(kind==='signature'){const h=battleHit(a,d,'signature');message=`${a.name} used ${BUSINESS_TYPES[battlerType(a)].move}: ${h.damage} damage${h.adv>1?' (type advantage!)':''}${h.crit?' · critical!':''}.`}else if(kind==='guard'){a.ward=1;a.hp=Math.min(a.maxHp,a.hp+5);message=`${a.name} used Risk Control: guard raised and 5 HP recovered.`}else if(kind==='rally'){a.extraMorale=clamp(a.extraMorale+12,0,35);a.hp=Math.min(a.maxHp,a.hp+8);message=`${a.name} held a Team Huddle: +12 temporary combat morale and +8 HP.`}else return;b.log.unshift(message);if(!activeFighter('enemy')){if(b.enemy.every(v=>v.hp<=0)){battleEnd(true);return}b.log.unshift('The rivals send in their next monster.')}const enemy=activeFighter('enemy'),player=activeFighter('own');if(enemy&&player){const ekind=b.round%4===0?'signature':(b.round%5===0?'guard':'quick');if(ekind==='guard'){enemy.ward=1;enemy.hp=Math.min(enemy.maxHp,enemy.hp+4);b.log.unshift(`${enemy.name} used Risk Control.`)}else{const h=battleHit(enemy,player,ekind);b.log.unshift(`${enemy.name} used ${ekind==='signature'?BUSINESS_TYPES[battlerType(enemy)].move:'Quick Pitch'}: ${h.damage} damage${h.adv>1?' (type advantage!)':''}.`)}if(!activeFighter('own')){if(b.own.every(v=>v.hp<=0)){battleEnd(false);return}b.log.unshift('Your next monster steps forward!')}}b.round++;save();renderBattle()}
function swapBattler(index){const b=state.battle;if(!b||b.result||index<1||index>=b.own.length||b.own[index].hp<=0)return;b.own.unshift(...b.own.splice(index,1));const enemy=activeFighter('enemy'),player=activeFighter('own');b.log.unshift(`${player.name} switched into battle.`);if(enemy){const h=battleHit(enemy,player,'quick');b.log.unshift(`${enemy.name} seized the opening: ${h.damage} damage.`)}if(!activeFighter('own')&&b.own.every(v=>v.hp<=0)){battleEnd(false);return}b.round++;save();renderBattle()}
function battleFace(f,role){const sp=species(f.species);return `<div class="combatant ${role}"><div class="combatArt">${creatureSvg(sp)}</div><div class="combatMeta"><b>${f.name}</b>${typePill(sp.btype)}<div class="hpTrack"><i style="width:${f.hp/f.maxHp*100}%"></i></div><div class="hpText">HP ${f.hp}/${f.maxHp} · Morale ${clamp(f.morale+f.extraMorale,0,100)}%</div><div class="combatStats">ATK ${battlerStat(f,'power')} · DEF ${battlerStat(f,'guard')} · SPD ${battlerStat(f,'speed')} · FOC ${battlerStat(f,'focus')}</div></div></div>`}
function renderBattle(){const b=state.battle;if(!b)return;const a=activeFighter('own'),e=activeFighter('enemy'),r=RIVALS.find(v=>v.id===b.rivalId);if(!a||!e)return;overlay('battle',`<div class="eyebrow">${r.title} · Round ${b.round}</div><div class="arenaTitle"><h2>Rival showdown</h2><span>${r.name}</span></div><div class="combatField">${battleFace(a,'friend')}<b class="versus">VS</b>${battleFace(e,'enemy')}</div><div class="battleStatus"><span>Focus points: <b>${a.sp}/3</b></span><span>Line-up: ${b.own.filter(v=>v.hp>0).length} vs ${b.enemy.filter(v=>v.hp>0).length}</span></div><div class="moveGrid"><button data-move-action="quick"><b>Quick Pitch</b><small>Reliable hit · +1 focus</small></button><button data-move-action="signature" ${a.sp<1?'disabled':''}><b>${BUSINESS_TYPES[battlerType(a)].move}</b><small>Strong type attack · −1 focus</small></button><button data-move-action="guard"><b>Risk Control</b><small>Guard next hit · heal 5 HP</small></button><button data-move-action="rally"><b>Team Huddle</b><small>+12 battle morale · heal 8 HP</small></button></div><div class="battleLog">${b.log.slice(0,3).map((line,i)=>`<div class="${i===0?'latest':''}">${line}</div>`).join('')}</div><div class="battleBench"><span>Bench:</span>${b.own.slice(1).map((f,i)=>`<button data-swap="${i+1}" ${f.hp<=0?'disabled':''}>${f.name} · ${f.hp} HP</button>`).join('')||'<small>No reserves</small>'}<button class="quitBattle" data-forfeit="1">Retreat</button></div>`,false,true)}
function closeBattle(){state.battle=null;save();closeModal();modalType='';$('#cover').classList.add('hidden');renderSide();canvas.focus()}
function closeModal(){if(!modalClosable)return;const wasBattleEnd=modalType==='battleEnd';modalType='';modalContext=null;$('#cover').classList.add('hidden');if(wasBattleEnd){state.battle=null;save();renderSide()}if(!state.crew.length&&!state.finished&&state.day<=10){starters();return}canvas.focus()}

function usePoi(p){if(p.kind==='arena'){tab('battle');showToast('The arena is open. Choose a rival crew to challenge.');return}if(p.kind==='hall'){tab('guild');showToast('Contract board opened. Deploy monsters from anywhere.');return}if(p.kind==='camp'){overlay('camp',`<div class="eyebrow">Base Camp · Day ${state.day}</div><h2>Finish the workday?</h2><p>${state.pending.length} contract${state.pending.length===1?'':'s'} will be resolved. Monsters on contract cannot also produce background goods. Wages, morale and fatigue update after the results.</p><div class="tipBox">${state.pending.length?state.pending.map(p=>p.job.name).join(' · '):'No contracts sent. You can send your crew from the Contract board first.'}</div><div class="btnRow"><button class="cta" data-day="1">Finish Day ${state.day}</button><button class="ghost" data-dismiss="1">Keep exploring</button></div>`);return}if(p.kind==='desk'){tab('hr');showToast('HR desk opened: maintain morale with credits.');return}if(p.kind==='npc'){const k=p.id+'-'+state.day;if(state.used[k])return showToast(`${p.name} has nothing new today.`);const sc=npcScenes[p.id];overlay('npc',`<div class="eyebrow">${p.name} · ${sc.tag}</div><h2>A workplace decision</h2><p class="lead">${sc.question}</p><div class="offerButtons">${sc.choices.map((o,i)=>`<button class="offer" data-npc="${i}" ${(o.money||0)<0&&state.cash<-(o.money||0)?'disabled':''}><strong>${o.label}</strong><span>${(o.money||0)<0?'Costs '+(-o.money)+' credits':'No upfront cost'}</span></button>`).join('')}</div>`);modalContext={npc:p.id};return}if(p.kind==='trader'||p.kind==='shrine'||p.kind==='lookout'){const k=(p.kind==='trader'?'trader':p.id)+'-'+state.day;if(state.used[k])return showToast('Already used today.');if(p.kind==='trader')overlay('trader','<div class="eyebrow">Supply Cart</div><h2>Trade supplies</h2><p>Sell spare supplies for 30 credits. One trade per day.</p><button class="cta" data-trade="1">Trade for 30 credits</button>');else overlay('discovery',`<div class="eyebrow">${p.name}</div><h2>${p.kind==='shrine'?'Recover energy':'Find spare supplies'}</h2><p>${p.kind==='shrine'?'Restore 12 energy to everyone. This does not increase morale.':'Find 20 credits that can fund HR interventions.'}</p><button class="cta" data-discovery="${p.id}">Collect reward</button>`);return}}
function finish(){state.finished=true;const jobs=state.contractHistory.filter(h=>h.success).length,wins=Object.values(state.battleWins).filter(Boolean).length,morale=overallMorale(),held=state.crew.length;const score=Math.round(jobs*75+wins*130+state.rep*2+morale*1.5+state.caught.length*28+Math.min(state.cash,800)*.35-(state.everRecruited-held)*35);let best=0;try{best=+(localStorage.getItem(BEST)||0);if(score>best)localStorage.setItem(BEST,score)}catch(e){}save();overlay('end',`<div class="eyebrow">Season complete · Business debrief</div><h2>${jobs>=6&&wins>=2?'A crew worth backing.':'What did your crew achieve?'}</h2><div class="seasonScore">${score}<small>${score>best?'NEW RECORD':'SEASON SCORE'}</small></div><div class="results"><div class="resultCell"><b>${jobs}</b><small>Contracts won</small></div><div class="resultCell"><b>${wins}/5</b><small>Rival crews beaten</small></div><div class="resultCell"><b>${morale}%</b><small>Final morale</small></div></div><p class="lead">Each contract success increased the attributes of its assigned monsters. Morale influenced both job prospects and battles, and could be restored by spending credits on suitable motivational techniques.</p><div class="tipBox">Cambridge link: compare Taylor’s financial incentives with Mayo’s social motivation, Herzberg’s motivators and the cost/commitment trade-off between hard and soft HRM.</div><div class="btnRow"><button class="cta" data-replay="1">New season</button><button class="ghost" data-export="1">Export my debrief</button></div>`,false,true)}
function formatDebrief(){return ['MONSTERWORKS — CAMBRIDGE BUSINESS 9609','',`Day ${Math.min(10,state.day)}/10`,`Credits ${state.cash}`,`Reputation ${state.rep}`,`Contracts successful ${state.contractHistory.filter(c=>c.success).length}`,`Rivals defeated ${Object.values(state.battleWins).filter(Boolean).length}/5`,`Final morale ${overallMorale()}%`,'','CREW AND PERMANENT CONTRACT STATS',...state.crew.map(c=>`${c.name} (${species(c.species).name}) · ${BUSINESS_TYPES[species(c.species).btype].name} · Morale ${Math.round(c.morale)}% · Jobs won ${c.contractsWon} · Base ${JSON.stringify(c.stats)} · Live ${JSON.stringify(Object.fromEntries(Object.keys(c.stats).map(k=>[k,effectiveStat(c,k)])))}`),'','CONTRACT RESULTS',...state.contractHistory.map(j=>`Day ${j.day}: ${j.name} — ${j.success?'SUCCESS':'FAILED'}, forecast ${j.chance}%, team ${j.team.join(' + ')}`),'','DECISIONS',...state.logs.slice().reverse().map(l=>`Day ${l.day}: ${l.msg}`),'','REFLECTION','1. How did low morale change effective stats and contract performance?','2. Which business types complemented one another in rival battles?','3. Which permanent stat gains came from contracts rather than combat?','4. Evaluate the costs and benefits of hard and soft HRM.'].join('\n')}
function keydown(e){if(e.target?.closest?.('input,textarea,select,[contenteditable="true"]')||e.isComposing)return;const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','shift','e'].includes(k))e.preventDefault();if(modalType){if((k===' '||k==='enter')&&modalType==='encounter'&&modalContext?.stage==='pulse'){e.preventDefault();pulse();return}if(k==='escape'&&modalClosable)closeModal();return}if(state.finished)return;if(k==='e'){interact();return}if(['1','2','3','4','5'].includes(k)){tab(['crew','guild','battle','hr','journal'][+k-1]);return}keys.add(k)}
function pickActions(e){const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab(b.dataset.tab);return}if(b.dataset.select!==undefined){selected=+b.dataset.select;renderSide();return}if(b.dataset.assign){const c=state.crew[selected];if(c){c.role=b.dataset.assign;log(`${c.name} assigned to ${ROLE[c.role].label}.`);renderSide()}return}if(b.dataset.goto){tab(b.dataset.goto);if(b.dataset.dismiss)closeModal();if(b.dataset.battleClose)closeBattle();return}if(b.dataset.policy){selectPolicy(b.dataset.policy);return}if(b.dataset.hr){runAction(b.dataset.hr);return}if(b.dataset.care){buyCare(b.dataset.care);return}if(b.dataset.contract){openContract(b.dataset.contract);return}if(b.dataset.contractSelect){toggleContractCrew(+b.dataset.contractSelect);return}if(b.dataset.contractGo){const m=modalContext;const ok=dispatchContract(m.contractId,m.teamIds);if(ok){closeModal();tab('guild');showToast('Crew dispatched. Finish the day at Base Camp for results.')}return}if(b.dataset.allContracts){state.showAllContracts=!state.showAllContracts;renderSide();return}if(b.dataset.rival){selectBattleRival(b.dataset.rival);return}if(b.dataset.battleSelect){const id=+b.dataset.battleSelect,m=modalContext;if(m?.rivalId){if(m.teamIds.includes(id))m.teamIds=m.teamIds.filter(x=>x!==id);else if(m.teamIds.length<3)m.teamIds.push(id);showBattlePicker()}return}if(b.dataset.battleGo){if(modalContext?.teamIds.length)startBattle(modalContext.rivalId,modalContext.teamIds);return}if(b.dataset.moveAction){battleMove(b.dataset.moveAction);return}if(b.dataset.swap){swapBattler(+b.dataset.swap);return}if(b.dataset.forfeit){battleEnd(false);return}if(b.dataset.battleClose){closeBattle();return}if(b.dataset.rest){const p=pois.find(v=>v.kind==='camp');if(Math.hypot(p.x-state.player.x,p.y-state.player.y)>2.2)showToast('Find Base Camp in the meadow to finish the day.');else usePoi(p);return}if(b.dataset.transfer){transferCrew();return}if(b.dataset.open==='help'){help();return}if(b.dataset.open==='codex'){codex();return}if(b.dataset.export){exportDebrief();return}if(b.dataset.dismiss){closeModal();return}if(b.dataset.start){if(b.dataset.start==='new'){state=fresh();createWild();createPickups();save();selected=0;starters()}else{closeModal();if(!state.crew.length)starters();else if(state.battle&&!state.battle.result)renderBattle();else{renderSide();showToast('Welcome back. Contracts and rivals are ready.')}}return}if(b.dataset.starter){const c=makeCrew(b.dataset.starter);state.crew.push(c);state.everRecruited++;if(!state.caught.includes(c.species))state.caught.push(c.species);if(!state.seen.includes(c.species))state.seen.push(c.species);selected=0;log(`${c.name} joined the team.`);closeModal();tab('crew');help();return}if(b.dataset.offer){recruitOffer(b.dataset.offer);return}if(b.dataset.pulse){pulse();return}if(b.dataset.day){closeModal();dayAdvance();return}if(b.dataset.trade){state.cash+=30;state.used['trader-'+state.day]=true;log('Sold field supplies for 30 credits.');closeModal();renderSide();return}if(b.dataset.discovery){applyDiscovery(b.dataset.discovery);return}if(b.dataset.npc!==undefined){useNpcChoice(+b.dataset.npc);return}if(b.dataset.transferConfirm){const c=state.crew[selected];if(c&&!busyCrewIDs().has(c.id)){state.crew.splice(selected,1);selected=0;log(`${c.name} was transferred voluntarily.`);closeModal();renderSide()}else showToast('Cannot transfer a monster out on contract.');return}if(b.dataset.finale){finish();return}if(b.dataset.replay){state=fresh();createWild();createPickups();selected=0;save();starters();return}}
function transferCrew(){if(state.crew.length<2)return showToast('Keep at least one creature.');const c=state.crew[selected];if(busyCrewIDs().has(c.id))return showToast('Crew member is currently on contract.');overlay('transfer',`<div class="eyebrow">Sanctuary transfer</div><h2>Transfer ${c.name}?</h2><p>They leave your six-monster roster so you can recruit a different business type. This cannot be undone.</p><div class="btnRow"><button class="cta danger" data-transfer-confirm="1">Confirm transfer</button><button class="ghost" data-dismiss="1">Cancel</button></div>`)}
function drawPoi(p){if(p.kind!=='arena'){drawPoiOriginal(p);return}const x=p.x*T,y=p.y*T;ctx.save();ctx.translate(x,y);ctx.fillStyle='#222e52';ctx.beginPath();ctx.ellipse(0,10,29,15,0,0,7);ctx.fill();ctx.fillStyle='#e59a73';ctx.fillRect(-21,-22,42,28);ctx.fillStyle='#e5c49a';ctx.beginPath();ctx.moveTo(-26,-21);ctx.lineTo(0,-48);ctx.lineTo(26,-21);ctx.closePath();ctx.fill();ctx.fillStyle='#7c3c65';ctx.fillRect(-27,-12,54,9);ctx.fillStyle='#fff8df';ctx.font='900 19px Arial';ctx.textAlign='center';ctx.fillText('VS',0,-9);ctx.restore();ctx.save();ctx.textAlign='center';ctx.font='800 11px Arial';const width=98;ctx.fillStyle='#0d2838db';ctx.beginPath();ctx.roundRect(x-width/2,y-63,width,20,7);ctx.fill();ctx.fillStyle='#f3e0ae';ctx.fillText('Rival Arena',x,y-49);ctx.restore()}

const EVOLUTION_NAMES={mossbun:['Teamble','Gatherbond','Synergiant'],budop:['Buzzbud','Brandbloom','Buzzillionaire'],glimmeray:['Pitchray','Idearay','Pivotphoon'],voltusk:['Hustusk','Overboar','KPIgon'],shardillo:['Auditillo','Ledgerillo','Audititan'],bouldo:['Bureaucrock','Formigator','Regulasaur'],tinkoon:['Pivotcoon','Hackoon','Pivotnado'],puddlefin:['Ledgerfin','Profitfin','Cashflow Kraken'],moonmew:['Synerlynx','Teamlynx','Consensusphinx'],cindlet:['Overtorch','Rushroar','Deadlinosaur'],zephyrip:['Viralark','Hypehawk','Trendzilla'],flarefox:['Permitfox','Licenfox','Redtape Renard']};

function canEvolve(c){const next=(c.evo||0)+1;return next<=2&&(state.echoes[c.species]||0)>=ECHO_COST[next]&&c.contractsWon>=WORK_REQUIRE[next]&&state.cash>=EVOLVE_COST[next]}

function evolveMonster(id){const c=state.crew.concat(state.reserves).find(c=>c.id===id);if(!c||!canEvolve(c))return;const n=c.evo+1;state.cash-=EVOLVE_COST[n];state.echoes[c.species]-=ECHO_COST[n];const previousName=c.name;c.evo=n;c.name=evolutionName(c);c.trust=clamp(c.trust+8,0,100);log(`${previousName} evolved into ${c.name}. Signature moves improve, but base attributes are unchanged.`);renderSide();overlay('evolved',`<div class="eyebrow">Talent evolution unlocked · ${addPokemonIdentity(c)}</div><h2>${evolutionName(c)}!</h2><div class="evoHero">${creatureSvg(species(c.species),c.evo)}</div><p class="lead">Your monster evolved through <b>duplicate catches</b> and <b>successful contracts</b>.</p><div class="results"><div class="resultCell"><b>+${c.evo*13}%</b><small>Signature move power</small></div><div class="resultCell"><b>+8</b><small>Loyalty gained</small></div><div class="resultCell"><b>0</b><small>Free base stat gains</small></div></div><div class="btnRow"><button class="cta" data-dismiss="1">Continue adventure</button></div>`,true)}
function vault(){const all=state.crew.concat(state.reserves);overlay('vault',`<div class="eyebrow">Talent Archive · ${state.caught.length}/${types.length} species discovered</div><h2>Collection & reserves</h2><p>A team holds six active monsters. New species caught when the team is full enter reserves; duplicates create <b>Talent Echoes</b> used for career evolution.</p><div class="results"><div class="resultCell"><b>${state.capturedTotal}</b><small>Successful catches</small></div><div class="resultCell"><b>${state.reserves.length}</b><small>In reserves</small></div><div class="resultCell"><b>${Object.values(state.echoes).reduce((a,b)=>a+b,0)}</b><small>Unspent echoes</small></div></div><div class="miniTitle">Active crew & reserves</div><div class="vaultGrid">${all.map(c=>`<div class="vaultCard">${cAvatar(species(c.species),c.evo||0)}<strong>${escapeHTML(c.name)}</strong><small>${c.contractsWon} successful jobs · ${addPokemonIdentity(c)}</small><small>Echoes: ${state.echoes[c.species]||0}</small><button data-vault-action="${state.reserves.includes(c)?'promote':'bench'}" data-vault-id="${c.id}" ${state.reserves.includes(c)&&state.crew.length>=6?'disabled':''}>${state.reserves.includes(c)?'Activate':'To reserves'}</button>${c.evo<2?`<button data-evolve="${c.id}" ${!canEvolve(c)?'disabled':''}>Evolve</button>`:''}</div>`).join('')}</div><p class="footNote">To swap a new recruit into a full crew: move a crew member into reserves first, then activate the replacement. Reserved creatures earn no contract growth or wages.</p><div class="btnRow"><button class="cta" data-dismiss="1">Back to world</button></div>`,true,true)}
function transferVault(id,action){const i=(action==='bench'?state.crew:state.reserves).findIndex(c=>c.id===id);if(i<0)return;const from=action==='bench'?state.crew:state.reserves,to=action==='bench'?state.reserves:state.crew;if(action==='bench'&&(state.crew.length<=1||busyCrewIDs().has(id)))return showToast('Keep one active monster, and finish contracts before benching.');if(action==='promote'&&state.crew.length>=6)return showToast('Bench one active monster first.');to.push(...from.splice(i,1));selected=clamp(selected,0,state.crew.length-1);save();renderSide();vault()}
