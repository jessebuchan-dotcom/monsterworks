olve</button></div><div class="quickRow"><button class="smallCta" data-goto="guild">Contracts</button><button class="ghost" data-goto="hr">Morale upkeep</button></div><p class="footNote">Permanent stats grow only from successful contracts. Evolution upgrades battle techniques, not base stats.</p></div>`:''}<button class="ghost wideBtn" data-vault="1">Open the Talent Archive</button>`}
function hrPanelOriginal(){const c=state.crew[selected],p=state.policy;return `<div class="sectionTitle"><h2>People Studio</h2><small>${state.actionsLeft} actions</small></div><div class="controlBox"><h3>HR strategy</h3><div class="policyBtns"><button class="${p==='hard'?'active':''}" data-policy="hard">Hard</button><button class="${p==='balanced'?'active':''}" data-policy="balanced">Mixed</button><button class="${p==='soft'?'active':''}" data-policy="soft">Soft</button></div><p style="margin:8px 0 0">${policyDescription(p)}</p></div>${c?`<div class="carePanel"><div class="contractHead"><b>Care is not free</b><small>${escapeHTML(c.name)} · ${Math.round(c.morale)}% morale</small></div><p>Low morale cuts every live stat. Choose spending that matches this monster’s needs.</p><div class="careRow"><button data-care="snack" ${state.cash<14?'disabled':''}>Care pack<b>14 cr</b><small>+16 morale</small></button><button data-care="personal" ${state.cash<27?'disabled':''}>Personal support<b>27 cr</b><small>+30 morale</small></button></div><button class="ghost wideBtn" data-care="team" ${state.cash<46?'disabled':''}>Whole-crew wellbeing · 46 credits</button></div><div class="miniTitle">Motivation techniques</div><div class="actionGrid">${actions.map(a=>`<button class="action" data-hr="${a.id}" ${state.actionsLeft<=0||state.cash<a.cost?'disabled':''}><b>${a.name}</b><span>${a.label}</span><em>${a.cost} credits</em></button>`).join('')}</div>`:''}<button class="ghost wideBtn" data-vault="1">Manage active crew / reserves</button><button class="cta wide" data-rest="1">Finish day at Base Camp</button>`}
function completeRecruit(success){const m=modalContext,w=state.wild.find(v=>v.id===m?.wildId);if(!w)return;state.wild=state.wild.filter(v=>v.id!==w.id);const t=species(w.species);if(success){state.capturedTotal++;const duplicate=state.caught.includes(t.id);if(duplicate){state.echoes[t.id]=(state.echoes[t.id]||0)+1;log(`Talent Echo gained for ${t.name}. ${state.echoes[t.id]} unspent echo${state.echoes[t.id]===1?'':'es'}; successful catches still matter after six monsters.`);overlay('duplicate',`<div class="eyebrow">Collection success · Talent Echo</div><h2>Another ${t.name}!</h2><div class="startArt">${cAvatar(t)}</div><p class="lead">This duplicate becomes a <b>Talent Echo</b> for ${t.name}. Combine echoes with successful contracts to unlock career evolutions; active slots stay free.</p><div class="results"><div class="resultCell"><b>${state.echoes[t.id]}</b><small>Unspent ${t.name} echoes</small></div><div class="resultCell"><b>${state.capturedTotal}</b><small>Lifetime catches</small></div></div><div class="btnRow"><button class="cta" data-dismiss="1">Keep catching</button><button class="ghost" data-vault="1">Talent Archive</button></div>`,true)}else{const c=makeCrew(t.id);c.morale=clamp(56+m.trust*.25,0,100);c.trust=clamp(m.trust,0,100);if(state.crew.length<6){state.crew.push(c);selected=state.crew.length-1}else{state.reserves.push(c)}state.rep=clamp(state.rep+2,0,100);state.everRecruited++;state.caught.push(t.id);log(`${c.name} ${state.crew.includes(c)?'joined your crew':'entered the Talent Archive reserves'}.`);overlay('recruited',`<div class="eyebrow">New species discovered</div><h2>${t.name} recruited!</h2><div class="startArt">${cAvatar(t)}</div><p class="lead">${state.crew.includes(c)?`${escapeHTML(c.name)} joined the active crew.`:`Your six active slots are full, so ${escapeHTML(c.name)} entered reserves. Open the Archive to swap them in.`} Motivator: <b>${cNeed(t.need)}</b>.</p><div class="btnRow"><button class="cta" data-dismiss="1">Explore</button><button class="ghost" data-vault="1">Collection</button></div>`,true);tab('crew')}}else{state.failed++;log(`${t.name} chose not to join. The recruitment fee is not refunded.`);overlay('recruitFail',`<div class="eyebrow">Recruitment unsuccessful</div><h2>The opportunity slipped away</h2><p>Recruitment costs credits whether it succeeds or not. Match the monster’s motivational needs and time the three pulses.</p><button class="cta" data-dismiss="1">Try a different monster</button>`,true)}save();renderSide()}
function recruitOffer(id){const m=modalContext,w=state.wild.find(v=>v.id===m?.wildId),o=offers.find(v=>v.id===id);if(!m||!w||!o||state.cash<o.cost)return;const t=species(w.species);state.cash-=o.cost;m.offer=o;m.stage='pulse';const fit=id===t.need?36:(id==='security'||id==='belonging'?19:13);m.trust=clamp(m.trust+fit+(state.recruitBonus||0),0,100);state.recruitBonus=0;save();$('#modalBody').innerHTML=`<div class="eyebrow">Recruiting · ${t.theory}</div><h2>Earn ${t.name}'s trust</h2><div style="display:flex;align-items:center;gap:12px">${cAvatar(t)}<p style="margin:0">${id===t.need?'Excellent match to their needs.':'A viable offer, but not their primary motivator.'}<br><small>${o.theory}</small></p></div><div class="dial"><div class="progressLine"><span>Trust</span><strong id="trustNumber">${m.trust}%</strong></div><div class="meter" style="height:12px"><i id="trustFill" style="width:${m.trust}%"></i></div><div class="dialTrack"><div class="dialZone" id="dialZone" style="left:${(m.target-.105)*100}%;width:21%"></div><div class="dialNeedle" id="dialNeedle"></div></div><div class="progressLine"><span>Stop in the green band</span><strong id="pulseCount">3 pulses</strong></div><button class="cta wide" data-pulse="1">PULSE · SPACE</button><p class="kbdHint">Reach 90% trust in three attempts. Recruitment has a real cost.</p></div>`;renderSide()}
function interact(){if(modalType||state.finished)return;const target=nearest();if(target?.type==='wild')encounter(target.value);else if(target?.type==='poi')usePoi(target.value)}
function createPickups(){const points=[];for(let z=0;z<4;z++)for(let j=0;j<4;j++){let found=false;for(let tries=0;tries<180&&!found;tries++){const x=[5,39,5,39][z]+2+Math.floor(hash(j+z*4,tries,state.seed+state.day*91)*25),y=[3,3,27,27][z]+2+Math.floor(hash(tries+2,j+z*4,state.seed+state.day*37)*17);if(!isSolid(x+.5,y+.5)&&!pois.some(p=>Math.hypot(p.x-x-.5,p.y-y-.5)<3)&&!points.some(p=>Math.hypot(p.x-x-.5,p.y-y-.5)<3)){points.push({x:x+.5,y:y+.5,taken:false,id:z*4+j});found=true}}}if(!points.some(p=>Math.hypot(p.x-18,p.y-20)<5)&&!isSolid(19.5,20.5))points.push({x:19.5,y:20.5,taken:false,id:99});state.pickups=points}
function openQuiz(p){if(state.quizCount>=3){p.taken=true;showToast('Daily research limit reached (3 rewards). Return tomorrow.');return}p.taken=true;const q=QUIZ_BANK[(p.id*11+state.day*13+state.seed)%QUIZ_BANK.length];const rot=(p.id+state.day)%4,choices=q[1].map((x,i)=>({text:x,original:i})).sort((a,b)=>((a.original+rot)%4)-((b.original+rot)%4));const prize=10+contractStage(state.day)*2;modalContext={q,choices,prize};overlay('quiz',`<div class="eyebrow">Motivation research · Credit cache</div><h2>Earn your credits</h2><p class="lead">${q[0]}</p><div class="earnTag">Correct answer: +${prize} credits · wrong answer: 0</div><div class="questionAnswers">${choices.map((a,i)=>`<button data-quiz-answer="${i}"><b>${String.fromCharCode(65+i)}.</b> ${escapeHTML(a.text)}</button>`).join('')}</div><p class="footNote">Three successful credit caches per day maximum. No automatic collection.</p>`,false,true);save()}
function answerQuiz(i){if(modalType!=='quiz')return;const m=modalContext,correct=m.choices[i]?.original===m.q[2];state.quizAttempted++;if(correct){state.cash+=m.prize;state.quizCount++;state.quizCorrect++;log(`Answered motivation theory correctly and earned ${m.prize} research credits.`)}else log('Missed a credit-cache question. No credits awarded; cache used.');overlay('quizResult',`<div class="eyebrow">${correct?'Research correct':'Research missed'}</div><h2>${correct?`+${m.prize} earned credits`:'No credits earned'}</h2><div class="quizResult ${correct?'':'wrong'}"><b>Correct response:</b> ${escapeHTML(m.q[1][m.q[2]])}<br>${escapeHTML(m.q[3])}</div><div class="btnRow"><button class="cta" data-dismiss="1">Back to exploration</button></div>`,true);renderSide()}
function update(dt){if(!state||modalType||state.finished)return;const p=state.player;for(const w of state.wild){const hx=w.homeX??w.x,hy=w.homeY??w.y,nx=hx+Math.sin(elapsed*.53+w.wander)*.29,ny=hy+Math.cos(elapsed*.43+w.wander)*.24;if(canWalk(nx,ny)){w.x=nx;w.y=ny}}let dx=(keys.has('d')||keys.has('arrowright')||virtual.has('right')?1:0)-(keys.has('a')||keys.has('arrowleft')||virtual.has('left')?1:0),dy=(keys.has('s')||keys.has('arrowdown')||virtual.has('down')?1:0)-(keys.has('w')||keys.has('arrowup')||virtual.has('up')?1:0);const oldX=p.x,oldY=p.y;if(dx||dy){playerVisual.facing=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');p.facing=playerVisual.facing;const len=Math.hypot(dx,dy),speed=(keys.has('shift')?6.35:4.25)*dt;dx=dx/len*speed;dy=dy/len*speed;if(canWalk(p.x+dx,p.y))p.x+=dx;if(canWalk(p.x,p.y+dy))p.y+=dy;const z=zone(p.x,p.y);if(!state.visitedZones.includes(z)){state.visitedZones.push(z);log(`New district discovered: ${zones[z][0]}. Seek its unique monsters, contacts and contracts.`)}if($('#biomeName').textContent!==zones[z][0])updateHud();for(const pickup of state.pickups){if(!pickup.taken&&Math.hypot(p.x-pickup.x,p.y-pickup.y)<.68){openQuiz(pickup);keys.clear();break}}}const moving=Math.hypot(p.x-oldX,p.y-oldY)>.00005;const ease=1-Math.exp(-dt*14);playerVisual.motion+=(+(moving)-playerVisual.motion)*ease;if(moving)playerVisual.phase+=dt*(keys.has('shift')?15:11);if(!Number.isFinite(playerVisual.x)||Math.hypot(playerVisual.x-p.x,playerVisual.y-p.y)>3){playerVisual.x=p.x;playerVisual.y=p.y}else{const follow=1-Math.exp(-dt*23);playerVisual.x+=(p.x-playerVisual.x)*follow;playerVisual.y+=(p.y-playerVisual.y)*follow}updateNear();if(elapsed-lastAutosave>5){save();lastAutosave=elapsed}}
function usePoi(p){if(p.kind==='arena'){state.arenaVisited=true;save();tab('battle');showToast('Arena unlocked! Rival crews above the Rookie League are available here.');return}if(p.kind==='hall'){tab('guild');showToast('The Copper Guild brokers specialist jobs. Contract dispatch works from any zone.');return}if(p.kind==='desk'){tab('hr');showToast('The People Studio manages policy, morale and the Talent Archive.');return}if(p.kind==='camp'){overlay('camp',`<div class="eyebrow">Base Camp · End of Day ${state.day}</div><h2>Settle the workday?</h2><p>${state.pending.length} contract dispatch${state.pending.length===1?'':'es'} will resolve. You will pay wages and overhead even if jobs fail. Unpaid costs damage morale and reputation.</p><div class="tipBox">Operating costs: ${state.crew.length*7+6} cr minimum · ${state.pending.length} assignment${state.pending.length===1?'':'s'} pending · ${state.quizCount} research answers correct today</div><div class="btnRow"><button class="cta" data-day="1">Finish Day ${state.day}</button><button class="ghost" data-dismiss="1">Keep exploring</button></div>`);return}if(p.kind==='trader'){overlay('outfitter',`<div class="eyebrow">${p.name} · No credit giveaways</div><h2>Outfit your expedition</h2><p>Buy practical field services or visit places you have discovered. Research caches, contracts and battles are how you <b>earn</b> credits.</p><div class="offerButtons"><button class="offer" data-supply="ration" ${state.cash<15?'disabled':''}><strong>15 cr · Field rations</strong><span>Restore 22 energy to the selected monster</span></button><button class="offer" data-supply="radar" ${state.cash<19?'disabled':''}><strong>19 cr · Recruitment radar</strong><span>+16 trust on your next capture offer</span></button><button class="offer" data-wardrobe="1"><strong>Change your trainer’s look</strong><span>Cosmetic changes, no credits required</span></button><button class="offer" data-supply="travel"><strong>Travel hub · 8 cr</strong><span>Fast trave function contractChance(job,ids){const group=ids.map(id=>state.crew.find(c=>c.id===id)).filter(Boolean);if(group.length<job.min)return 0;const quality=group.reduce((sum,c)=>sum+effectiveStat(c,job.stat)*.70+effectiveStat(c,'spirit')*.25+effectiveStat(c,'speed')*.12+(c.boost||0)*16,0)/group.length;const right=group.filter(c=>species(c.species).btype===job.preferred).length;const cohesion=group.length>1?Math.round(group.reduce((n,c)=>n+c.trust,0)/group.length/14):0;const expanded=(group.length-job.min)*8,perk=job.preferred==='synergy'&&state.guildPerks.mentor?5:job.preferred==='redtape'&&state.guildPerks.foreman?5:job.preferred==='disruptor'&&state.guildPerks.captain?5:0;const forecast=clamp(Math.round(49+(quality-job.difficulty)*2.1+right*14+cohesion+expanded+perk),13,93);return job.intro?Math.max(82,forecast):forecast}
function dispatchContract(id,ids){const job=contractById(id);if(!job||job.unlock>state.day||(job.npc&&!state.npcUnlocked[job.npc])||state.contractsDone[id]||state.pending.some(p=>p.id===id))return false;const free=new Set(availableForWork().map(c=>c.id));if(ids.length<job.min||ids.length>3||new Set(ids).size!==ids.length||ids.some(v=>!free.has(v)))return false;const fee=dispatchFee(job);if(state.cash<fee){showToast(`You need ${fee} credits to dispatch ${job.name}. Earn credits through contracts, quizzes or the arena.`);return false}state.cash-=fee;let chance=contractChance(job,ids);if(state.intelCharges>0){chance=Math.min(96,chance+8);state.intelCharges--}state.pending.push({id,day:state.day,teamIds:[...ids],chance,job:{...job},fee});log(`${job.name}: ${ids.length} monster${ids.length===1?'':'s'} assigned. Paid ${fee} cr dispatch fee; ${chance}% success forecast.`);renderSide();save();return true}

function completeContracts(){const result=[];for(const p of state.pending){const job=p.job,group=p.teamIds.map(id=>state.crew.find(c=>c.id===id)).filter(Boolean);if(!group.length)continue;const chance=p.chance,success=Math.random()*100<chance,row={id:job.id,name:job.name,day:state.day,success,chance,team:group.map(c=>c.name),teamIds:group.map(c=>c.id),reward:success?job.reward:0};state.contractHistory.push(row);if(success){state.contractsDone[job.id]=true;state.cash+=job.reward;state.rep=clamp(state.rep+job.rep,0,100);state.totalWork+=job.reward;group.forEach(c=>{c.contractsWon++;c.stats[job.stat]=Math.min(65,c.stats[job.stat]+2);const extra=job.stat==='spirit'?'power':'spirit';c.stats[extra]=Math.min(65,c.stats[extra]+1);c.trust=clamp(c.trust+3,0,100);c.morale=clamp(c.morale+2,0,100)});if(job.npc){state.guildPerks[job.npc]=true;if(job.npc==='ranger')state.crew.forEach(c=>c.morale=clamp(c.morale+5,0,100));if(job.npc==='captain')state.recruitBonus+=6}log(`SUCCESS ${job.name}: +${job.reward} earned credits; assigned crew gain permanent base attributes${job.npc?' and a guild perk':''}.`)}else{state.rep=clamp(state.rep-2,0,100);group.forEach(c=>{c.morale=clamp(c.morale-7,0,100);c.energy=clamp(c.energy-8,0,100)});log(`FAILED ${job.name} (${chance}% chance): dispatch fee lost; no attribute growth.`)}group.forEach(c=>{c.energy=clamp(c.energy-14,0,100);c.boost=0});result.push(row)}state.pending=[];return result}
function dayAdvanceOriginal(){if(state.finished)return;if(!state.crew.length){overlay('note','<h2>Recruit a monster first</h2><p>You need an active workforce to trade and compete.</p><button class="cta" data-dismiss="1">Explore</button>');return}const day=state.day,results=completeContracts(),pol=state.policy;let output={grove:0,forge:0,scout:0},departed=[];const policyFee=pol==='soft'?14:0;for(const c of [...state.crew]){const t=species(c.species);if(!results.some(r=>r.teamIds.includes(c.id))){const fit=c.role===t.role?1.14:.82,live=(effectiveStat(c,'power')+effectiveStat(c,'focus')+effectiveStat(c,'spirit'))/3,units=Math.max(0,Math.round(live*.37*fit*(pol==='hard'?1.16:pol==='soft'?1.05:1)*(1+(c.boost||0))));output[c.role]+=units;state.totalWork+=units;c.energy=clamp(c.energy-(pol==='hard'?19:pol==='soft'?11:14),0,100)}c.tenure++;if(pol==='hard'){c.morale=clamp(c.morale-12,0,100);c.energy=clamp(c.energy-9,0,100);c.trust=clamp(c.trust-6,0,100)}else if(pol==='soft'){c.morale=clamp(c.morale+4,0,100);c.trust=clamp(c.trust+3,0,100)}else{c.morale=clamp(c.morale-6,0,100);c.trust=clamp(c.trust-1,0,100)}if(state.guildPerks.ranger)c.energy=clamp(c.energy+4,0,100);if(c.energy<18)c.morale=clamp(c.morale-7,0,100);c.energy=clamp(c.energy+10,0,100);c.boost=0;if(c.morale<14||c.trust<12){if(Math.random()<.45){departed.push(c.name);state.crew=state.crew.filter(v=>v.id!==c.id);state.rep=clamp(state.rep-7,0,100)}}}const revenue=Math.round(output.grove*.21+output.forge*.25+output.scout*.23),wages=state.crew.length*(pol==='hard'?6:pol==='soft'?10:8),overhead=6,required=wages+overhead+policyFee,available=state.cash+revenue,shortfall=Math.max(0,required-available);state.cash=Math.max(0,available-required);if(shortfall){for(const c of state.crew){c.morale=clamp(c.morale-13,0,100);c.trust=clamp(c.trust-10,0,100)}state.rep=clamp(state.rep-5,0,100);log(`Wages/overheads short by ${shortfall} cr. Morale, loyalty and reputation fell.`)}state.resources.grove+=output.grove;state.resources.forge+=output.forge;state.resources.scout+=output.scout;state.policyHistory.push({day,policy:pol,output:Object.values(output).reduce((a,b)=>a+b,0),morale:overallMorale(),cash:state.cash,departed:departed.length});log(`Day ${day}: ${results.filter(r=>r.success).length}/${results.length} contracts; +${revenue} background income, −${wages} wages, −${overhead} overhead${policyFee?', −'+policyFee+' policy':''}.`);if(departed.length)log(`${departed.join(', ')} left the active workforce.`);state.day++;state.actionsLeft=3;state.used={};state.quizCount=0;state.battle=null;selected=clamp(selected,0,Math.max(0,state.crew.length-1));createWild();createPickups();save();renderSide();const lines=results.map(r=>`<div class="dayOutcome"><span class="pill ${r.success?'green':'pink'}">${r.success?'SUCCESS':'FAILED'}</span><b>${r.name}</b><small>${r.success?'+'+r.reward+' cr & contract stats':'No growth · −7 morale'}</small></div>`).join('');overlay('day',`<div class="eyebrow">Day ${day} · Business results</div><h2>${results.filter(r=>r.success).length} successful contract${results.filter(r=>r.success).length===1?'':'s'}</h2>${lines||'<p>No contracts completed. Your workforce still incurs costs.</p>'}<div class="results"><div class="resultCell"><b>+${revenue}</b><small>Idle crew income</small></div><div class="resultCell"><b>−${required}</b><small>Payroll, policy & overhead</small></div><div class="resultCell"><b>${state.cash}</b><small>Remaining credits</small></div></div>${shortfall?'<div class="tipBox" style="border-color:#ff9ab1">Unpaid costs damaged morale and loyalty. Earning credits is essential.</div>':''}<p class="footNote">Permanent attributes increased only for monsters on successful contracts. Evolve through contract wins + duplicate catches.</p><div class="btnRow"><button class="cta" data-dismiss="1">Continue Day ${state.day}</button><button class="ghost" data-goto="guild" data-dismiss="1">Next contracts</button></div>`,true,true)}
function battleEnd(won){const b=state.battle,r=RIVALS.find(v=>v.id===b.rivalId),first=!state.battleWins[r.id];let pay=0,rep=0;if(won){pay=first?r.reward:0;rep=first?r.rep:1;state.cash+=pay;state.rep=clamp(state.rep+rep,0,100);state.battleWins[r.id]=true;log(`${r.name} defeated: ${first?'+'+pay+' earned credits':'rival already beaten — no repeat credit reward'}, +${rep} rep. No base stats.`)}else{log(`Defeat to ${r.name}. Recovery costs credits; matching types and morale matter.`)}for(const f of b.own){const c=state.crew.find(v=>v.id===f.crewId);if(c){c.energy=clamp(c.energy-(won?9:12),0,100);if(!won)c.morale=clamp(c.morale-6,0,100)}}b.result=won?'win':'loss';save();renderSide();overlay('battleEnd',`<div class="eyebrow">${r.title} · ${won?'Victory':'Defeat'}</div><h2>${won?'The rival crew falls!':'The rival crew prevails'}</h2><div class="startArt">${(won?b.own:b.enemy).slice(0,3).map(v=>cAvatar(species(v.species),v.evo||0)).join('')}</div><p class="lead">${won?`You earned ${pay} credits and ${rep} reputation.${first?' First-clear reward claimed.':' Repeat wins do not generate credits.'}`:'Try a different type matchup, improve morale through appropriate HR methods, and earn contract stats.'}</p><div class="tipBox">Rival wins do not increase permanent stats. Successful contracts are your only route to base-stat growth.</div><div class="btnRow"><button class="cta" data-battle-close="1">Back to world</button><button class="ghost" data-goto="guild" data-battle-close="1">Contracts</button></div>`,true,true)}
function selectBattleRival(id){const r=RIVALS.find(x=>x.id===id);if(!r||r.unlock>state.day||state.battleAttempts[id]===state.day)return;if(id!=='rookie'&&!state.arenaVisited){overlay('note',`<div class="eyebrow">Arena qualification</div><h2>Find the Ember Arena</h2><p>The rookie crew is open to everyone. For stronger rivals, travel to the southeast district and interact with the Rival Arena once to unlock the championship circuit.</p><button class="cta" data-dismiss="1">Explore the Highlands</button>`);return}modalContext={rivalId:id,teamIds:[]};showBattlePicker()}

function battleHit(a,d,kind){const special=kind==='signature',power=special?battlerStat(a,'focus')*.95+battlerStat(a,'power')*.35:battlerStat(a,'power')*1.05+battlerStat(a,'speed')*.15;const defence=battlerStat(d,'guard')*.31,critical=Math.random()<battlerStat(a,'focus')/300;let amount=Math.round(Math.max(3,(power+7-defence)*(special?1.13:.91)*advantage(a,d)*(critical?1.5:1)*(special?1+(a.evo||0)*.13:1)));if(d.ward)amount=Math.max(2,Math.floor(amount*.45));d.hp=Math.max(0,d.hp-amount);d.ward=0;return{damage:amount,crit:critical,adv:advantage(a,d)}}

const mwRemoteVisuals=new Map();
window.MWDrawPeers=function(worldCtx,tileSize,sprites){
 const peers=window.MWMultiplayer?.players||[];
 const now=performance.now();
 const active=new Set();
 for(const remote of peers){
  if(!remote||typeof remote.uid!=='string'||!Number.isFinite(remote.x)||!Number.isFinite(remote.y))continue;
  const id=remote.uid;active.add(id);
  let v=mwRemoteVisuals.get(id);
  if(!v){v={x:remote.x,y:remote.y,facing:remote.facing||'down',motion:0,phase:0,lastFrame:now};mwRemoteVisuals.set(id,v)}
  const dt=Math.max(0,Math.min(.1,(now-v.lastFrame)/1000));v.lastFrame=now;
  const distance=Math.hypot(remote.x-v.x,remote.y-v.y);
  if(distance>6){v.x=remote.x;v.y=remote.y} // Large jumps are teleports, not walking.
  else {const k=1-Math.exp(-13*dt);v.x+=(remote.x-v.x)*k;v.y+=(remote.y-v.y)*k}
  v.facing=['up','down','left','right'].includes(remote.facing)?remote.facing:'down';
  v.motion=distance>.015?Math.min(1, distance*5):Math.max(0,v.motion-dt*7);
  v.phase+=v.motion*dt*14;
  const sx=v.x*tileSize,sy=v.y*tileSize;
  if(sx<camera.x-55||sx>camera.x+cw+55||sy<camera.y-72||sy>camera.y+ch+45)continue;

  const look={...DEFAULT_LOOK,skin:remote.skin,coat:remote.coat,hair:remote.hair,gear:remote.gear,gender:remote.gender};
  sprites.push({y:v.y,fn:()=>{
   drawTrainerCharacter(remote,look,v);
   worldCtx.save();worldCtx.textAlign='center';worldCtx.textBaseline='middle';
   worldCtx.font='800 12px Arial, sans-serif';
   const textWidth=worldCtx.measureText(name).width;
   const labelWidth=Math.max(44,Math.min(162,textWidth+18));
   worldCtx.fillStyle='#102a3cec';worldCtx.strokeStyle='#8fe4d0aa';worldCtx.lineWidth=1;
   worldCtx.beginPath();worldCtx.roundRect(sx-labelWidth/2,sy-58,labelWidth,21,7);worldCtx.fill();worldCtx.stroke();
   worldCtx.fillStyle='#f3ffed';worldCtx.fillText(name,sx,sy-47);
   worldCtx.restore();
  }});
 }
 for(const id of mwRemoteVisuals.keys())if(!active.has(id))mwRemoteVisuals.delete(id);

 overlay('encounter',`<div class="eyebrow">${escapeHTML(t.name)} · Recruitment</div><div class="catchHero"><div class="catchOrb">${creatureSvg(t)}</div><div class="catchInfo"><h2>${escapeHTML(t.name)}</h2><div class="catchMeter"><div class="catchMeterBar"><i id="trustFill" style="width:${m.trust}%"></i></div><b id="trustNumber">${m.trust}%</b></div><div class="catchStars">${[0,1,2].map(i=>`<span class="${i<m.perfect?'perfect':''}">★</span>`).join('')}</div></div></div><div class="captureTopline" style="justify-content:flex-end"><button data-sound-toggle="1">${captureAudio?'♫ On':'♫ Off'}</button></div><div class="captureSteps">${[1,2,3].map(i=>`<div class="${i<m.pulses+1?'done':i===m.pulses+1?'current':''}">${i}</div>`).join('')}${m.maxPulses===4?'<div class="current">4</div>':''}</div><div class="dial catchDial"><div class="dialTrack"><div class="dialZone" id="dialZone" style="left:${(m.target-width/2)*100}%;width:${width*100}%"></div><div class="dialNeedle" id="dialNeedle"></div></div><button class="cta wide catchPulseButton" data-pulse="1">LOCK PACT</button><button class="catchRetreatLink" data-catch-retreat="1">Withdraw</button></div>${feedback?`<div class="catchFeedback">${escapeHTML(feedback)}</div>`:''}`,false,true);
};
window.addEventListener('click',ev=>{
 const b=ev.target.closest?.('button');if(!b)return;
 if(b.dataset.mw41QuizNext!==undefined){ev.preventDefault();ev.stopImmediatePropagation();openQuiz({id:Number(b.dataset.mw41QuizNext),taken:true});return}
 if(b.dataset.mw41VaultPage!==undefined){ev.preventDefault();ev.stopImmediatePropagation();mw41VaultPage+=Number(b.dataset.mw41VaultPage);vault();return}
},true);
window.MonsterWorks.version='4.1';
window.MonsterWorks.inspectRefinement=()=>({quizAttempts:state.quizAttempted,quizCorrect:state.quizCorrect,quizToday:state.quizCount,quizPrize:modalContext?.prize||null,quizDifficulty:modalContext?.quizLevel||null,selectedEvolution:state.crew[selected]?evolutionState(state.crew[selected]):null});
// ========================== END VERSION 4.1 ==========================


// MonsterWorks 5.0 bridge: optional online services never change standalone mechanics.
window.MWGameBridge={
  snapshot(){return state?JSON.parse(JSON.stringify(state)):null},
  player(){if(!state)return null;return {
    name:String(state.trainerName||'Trainer').slice(0,22),
    x:state.player.x,y:state.player.y,
    facing:playerVisual.facing||state.player.facing||'down',
    appearance:{...DEFAULT_LOOK,...state.appearance}
  }},
  importCampaign(raw){
    const candidate=typeof raw==='string'?JSON.parse(raw):raw;
    if(!validCampaign(candidate))throw Error('Invalid or incompatible campaign data.');
    state=upgradeState(JSON.parse(JSON.stringify(candidate)));
    if(!state.wild.length)createWild();
    if(!state.pickups.length)createPickups();
    playerVisual.x=state.player.x;playerVisual.y=state.player.y;
    playerVisual.facing=state.player.facing||'down';
    selected=0;
    save();renderSide();updateNear();welcome(true);
    return {day:state.day,trainerName:state.trainerName,crew:state.crew.length};
  }
};

boot();
})();

</script>
<script type="module">
// MonsterWorks 5.1 — Stage 1 classroom shared world.
// Direct browser Firebase imports; does not require Node.js, npm or a build step.
// Stage 1 synchronises movement and individual saves, not battles/economic rewards.
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import {getAuth, signInAnonymously, onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import {getDatabase, ref, get, set, update, remove, onValue, onChildAdded, onChildChanged, onChildRemoved, onDisconnect, runTransaction} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js';
const firebaseConfig = {
  apiKey: 'AIzaSyB9wGqrrWjSgOd698Dq6VKG-6_kZMHiFXE',
  authDomain: 'monsterworks.firebaseapp.com',
  databaseURL: 'https://monsterworks-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'monsterworks',
  storageBucket: 'monsterworks.firebasestorage.app',
  messagingSenderId: '877597704674',
  appId: '1:877597704674:web:1f1b9012529b33979eb9bb',
  measurementId: 'G-53YTEJV7E4'
};

const $ = (selector) => document.querySelector(selector);
const game = window.MWGameBridge;
const roster = window.MWMultiplayer = {players: []};
const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const configured = !!(firebaseConfig.apiKey && !String(firebaseConfig.apiKey).includes('YOUR_') && firebaseConfig.projectId && !String(firebaseConfig.projectId).includes('YOUR_') && firebaseConfig.databaseURL && !String(firebaseConfig.databaseURL).includes('YOUR_') && firebaseConfig.appId && !String(firebaseConfig.appId).includes('YOUR_'));
let db,auth,uid='',connection=false,room='',slotIndex=null,rosterStop=null,connectStop=null;
let saveReady=false,cloudSavePresent=false,cloudSavedAt=0,lastSaveJSON='',pendingSaveTimer=0,lastPositionSent=0,lastX=NaN,lastY=NaN,lastFacing='';
let saveInFlight=false,saveQueued=false,cloudPromptShown=false;
const remoteSlots=new Map();
let initPromise=null,host=false;

const ui=document.createElement('div');
ui.innerHTML=`<div id="mw5Dialog" hidden role="dialog" aria-modal="true" aria-labelledby="mw5Title">
 <div class="mw5Panel">
  <div class="mw5Top"><h2 id="mw5Title">MonsterWorks Multiplayer</h2><button type="button" class="mw5Close" id="mw5Close">✕</button></div>
  <p id="mw5Intro">30 players · One shared world · Individual campaigns</p>
  <label>Classroom code<input id="mw5RoomCode" placeholder="6-character code" spellcheck="false" autocomplete="off" maxlength="6" autocapitalize="characters"></label>
  <div class="mw5Btns"><button type="button" id="mw5Create" class="mw5Primary">Create room</button><button type="button" id="mw5Join">Join room</button></div>
  <p id="mw5RoomLabel" class="mw5Code" hidden></p>
  <p id="mw5Status" class="mw5Info"></p>
  <div class="mw5Btns"><button type="button" id="mw5Save">Save to cloud</button><button type="button" id="mw5Load">Restore cloud save</button><button type="button" id="mw5Leave">Leave room</button></div>
  <button type="button" id="mw5UseLocal" hidden>Use this device’s campaign instead (replaces cloud save)</button>
  <p id="mw5Error" class="mw5Error" role="alert" aria-live="polite"></p>
  <p class="mw5Info">Use a pseudonym, not a student's full name. No public chat. PvP will be added later.</p>
 </div>
</div>`;
document.body.appendChild(ui);
const launcher=$('#mwmp-open'),dialog=$('#mw5Dialog'),status=$('#mw5Status'),error=$('#mw5Error'),roomLabel=$('#mw5RoomLabel');
function message(text='',isError=false){(isError?error:status).textContent=text; if(!isError)error.textContent=''}
function open(){dialog.hidden=false;render();$('#mw5RoomCode').focus()}
function close(){dialog.hidden=true;document.querySelector('#world')?.focus()}
launcher.addEventListener('click',open);
$('#mw5Close').addEventListener('click',close);
dialog.addEventListener('click',(e)=>{if(e.target===dialog)close()});
dialog.addEventListener('keydown',(e)=>{if(e.key==='Escape'){e.preventDefault();close()}e.stopPropagation()});
function render(){const count=roster.players.length+(room&&slotIndex!==null?1:0);launcher.dataset.status=room&&connection?'online':'offline';launcher.textContent=room?`🌐 ${room} · ${count}/30`:'🌐 Multiplayer';roomLabel.hidden=!room;roomLabel.textContent=room||'';$('#mw5Create').disabled=!configured||!uid||!!room;$('#mw5Join').disabled=!configured||!uid||!!room;$('#mw5Save').disabled=!uid||!saveReady;$('#mw5Load').disabled=!uid||!cloudSavePresent;$('#mw5UseLocal').hidden=!cloudSavePresent||saveReady;$('#mw5Leave').disabled=!room;$('#mw5RoomCode').disabled=!!room;if(room){status.textContent=`${connection?'Connected':'Reconnecting'} · ${count}/30 trainers · ${roster.players.length} other trainer${roster.players.length===1?'':'s'} detected · ${host?'Room owner':'Participant'}`}}
function code(){const a=new Uint8Array(6);crypto.getRandomValues(a);return Array.from(a,v=>alphabet[v%alphabet.length]).join('')}
function cleanRoom(v){return String(v||'').trim().toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g,'').slice(0,6)}
function safePlayer(){const raw=game?.player?.();if(!raw)return null;const a=raw.appearance||{};return {
 uid,name:String(raw.name||'Trainer').slice(0,22),
 x:Math.max(0,Math.min(105,Number(raw.x)||0)),y:Math.max(0,Math.min(48,Number(raw.y)||0)),
 facing:['up','down','left','right'].includes(raw.facing)?raw.facing:'down',
 skin:Math.max(0,Math.min(2,Math.trunc(Number(a.skin)||0))),
 coat:Math.max(0,Math.min(4,Math.trunc(Number(a.coat)||0))),
 hair:Math.max(0,Math.min(3,Math.trunc(Number(a.hair)||0))),
 gear:Math.max(0,Math.min(3,Math.trunc(Number(a.gear)||0))),
 gender:['male','female','nonbinary'].includes(a.gender)?a.gender:'nonbinary',
 updatedAt:Date.now()
}}
async function init(){if(initPromise)return initPromise;initPromise=(async()=>{
 if(!configured){message('Firebase config is not installed yet. The game remains playable offline.');return}
 try{const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getDatabase(app);onAuthStateChanged(auth,u=>{uid=u?.uid||'';render()});
 await signInAnonymously(auth);uid=auth.currentUser?.uid||'';
 message('Firebase connected. Create a classroom or enter its code.');render();
 await inspectCloudSave();
 }catch(e){message(`Firebase connection: ${e.code||e.message}`,true);render()}
 })();return initPromise}
async function inspectCloudSave(){
 if(!uid)return;
 try{
  const snap=await get(ref(db,`saves/${uid}`));
  cloudSavePresent=snap.exists();
  if(cloudSavePresent){
   // Protect a previously saved campaign: never silently overwrite it with
   // the current browser's fresh/older local state before a choice is made.
   saveReady=false;
   cloudSavedAt=snap.val()?.updatedAt||0;
   message('Existing cloud campaign found. Choose Restore cloud save, or explicitly replace it with this device’s campaign.');
  } else {
   saveReady=true;
   message('Cloud connected. Your campaign is ready for automatic saving.');
  }
  render();
 }catch(e){saveReady=false;message(`Cloud save unavailable: ${e.code||e.message}`,true);render()}
}
async function saveCloud(force=false){
 if(!uid||!saveReady){if(force)message('Choose Restore cloud save or Use this device’s campaign first.',true);return}
 const snap=game?.snapshot?.();
 if(!snap||typeof snap!=='object'||!Array.isArray(snap.crew))return;
 const signature=JSON.stringify(snap);
 if(!force&&signature===lastSaveJSON)return;
 if(saveInFlight){saveQueued=true;return}
 if(!force&&Date.now()-cloudSavedAt<12000){
  clearTimeout(pendingSaveTimer);
  pendingSaveTimer=setTimeout(()=>saveCloud(false),12000-(Date.now()-cloudSavedAt)+200);
  return;
 }
 saveInFlight=true;
 try{
  await set(ref(db,`saves/${uid}`),{state:snap,updatedAt:Date.now(),schema:1});
  cloudSavedAt=Date.now();lastSaveJSON=signature;cloudSavePresent=true;
  if(force)message('Cloud campaign saved.');
 }catch(e){message(`Could not save campaign: ${e.code||e.message}`,true)}
 finally{
  saveInFlight=false;
  if(saveQueued){saveQueued=false;clearTimeout(pendingSaveTimer);pendingSaveTimer=setTimeout(()=>saveCloud(false),1200)}
  render();
 }
}
async function chooseLocalCampaign(){
 if(!uid||!cloudSavePresent||saveReady)return;
 if(!window.confirm('This replaces the existing cloud campaign with the campaign open on this device. Have you backed up any progress you want to keep?'))return;
 saveReady=true;render();
 await saveCloud(true);
}
async function loadCloud(){if(!uid)return message('Sign-in is not ready.',true);if(!window.confirm('Replace the currently open campaign with your cloud save? Download a local backup first if needed.'))return;try{const snap=await get(ref(db,`saves/${uid}`));const saved=snap.val()?.state;if(!saved)return message('No cloud campaign was found.',true);const result=game.importCampaign(saved);saveReady=true;cloudSavePresent=true;cloudSavedAt=snap.val()?.updatedAt||Date.now();lastSaveJSON=JSON.stringify(saved);message(`Restored ${result.trainerName} · Day ${result.day} · ${result.crew} crew members`);render();close()}catch(e){message(`Could not restore cloud campaign: ${e.message}`,true)}}
function refreshRoster(){roster.players=Array.from(remoteSlots.values()).filter(p=>p&&p.uid&&p.uid!==uid);render()}
function handleSlotChange(snap){if(snap.exists())remoteSlots.set(snap.key,snap.val());else remoteSlots.delete(snap.key);refreshRoster()}
function handleSlotRemove(snap){remoteSlots.delete(snap.key);refreshRoster()}
async function claimSlot(){if(!room||!db||!uid)return;const me=safePlayer();if(!me)return;const base=`rooms/${room}/slots`;
 // Slots 0–29 enforce the maximum room population at the data-model level.
 let found=-1;try{const read=await get(ref(db,base));read.forEach(s=>{if(s.val()?.uid===uid)found=Number(s.key)})}catch(e){message(`Unable to read room: ${e.code||e.message}`,true);return}
 const order=found>=0?[found]:Array.from({length:30},(_,i)=>i);
 for(const i of order){try{const slotRef=ref(db,`${base}/${i}`);const transaction=await runTransaction(slotRef,current=>{
 if(current && current.uid!==uid)return;
 return {...me,updatedAt:Date.now()};
 },{applyLocally:false});
 if(transaction.committed){slotIndex=i;await onDisconnect(slotRef).remove();message(`Joined room ${room}. You are occupying one of 30 places.`);render();return}
 }catch(e){if(i===order[order.length-1])message(`Unable to enter room: ${e.code||e.message}`,true)}}
 if(found>=0){slotIndex=null;message('Could not reconnect to your previous slot.',true)}else message('This classroom is full (30/30).',true)
}
async function attachRoom(value){if(rosterStop){rosterStop();rosterStop=null}if(connectStop){connectStop();connectStop=null}room=value;slotIndex=null;remoteSlots.clear();roster.players=[];lastX=NaN;lastY=NaN;lastFacing='';
 const slotsRef=ref(db,`rooms/${room}/slots`);
 const stopA=onChildAdded(slotsRef,handleSlotChange,e=>message(`Room listener: ${e.code||e.message}`,true));
 const stopC=onChildChanged(slotsRef,handleSlotChange,e=>message(`Room listener: ${e.code||e.message}`,true));
 const stopR=onChildRemoved(slotsRef,handleSlotRemove,e=>message(`Room listener: ${e.code||e.message}`,true));
 rosterStop=()=>{stopA();stopC();stopR()};
 connectStop=onValue(ref(db,'.info/connected'),s=>{connection=!!s.val();render();if(connection)claimSlot()},e=>message(`Connection: ${e.code||e.message}`,true));render();
}
async function createRoom(){await init();if(!db||!uid)return;try{for(let i=0;i<8;i++){
 const value=code(),metaRef=ref(db,`rooms/${value}/meta`);
 const result=await runTransaction(metaRef,current=>current===null?{owner:uid,maxPlayers:30,createdAt:Date.now()}:undefined,{applyLocally:false});
 if(result.committed){host=true;$('#mw5RoomCode').value=value;await attachRoom(value);return}
 }message('Could not generate a unique room code. Try again.',true)}catch(e){message(`Room creation failed: ${e.code||e.message}`,true)}}
async function joinRoom(){await init();if(!db||!uid)return;const value=cleanRoom($('#mw5RoomCode').value);if(value.length!==6){message('Enter a valid six-character classroom code.',true);return}try{const s=await get(ref(db,`rooms/${value}/meta`));if(!s.exists()){message('That classroom code does not exist.',true);return}host=s.val()?.owner===uid;await attachRoom(value)}catch(e){message(`Joining failed: ${e.code||e.message}`,true)}}
async function leaveRoom(){if(room&&slotIndex!==null){const oldSlot=ref(db,`rooms/${room}/slots/${slotIndex}`);try{await onDisconnect(oldSlot).cancel()}catch{}try{await remove(oldSlot)}catch{}}
 rosterStop?.();connectStop?.();rosterStop=null;connectStop=null;room='';slotIndex=null;connection=false;host=false;roster.players=[];remoteSlots.clear();$('#mw5RoomCode').disabled=false;message('Left the classroom. Your campaign remains saved.');render()}
$('#mw5Create').addEventListener('click',createRoom);
$('#mw5Join').addEventListener('click',joinRoom);
$('#mw5Leave').addEventListener('click',leaveRoom);
$('#mw5Save').addEventListener('click',()=>saveCloud(true));
$('#mw5Load').addEventListener('click',loadCloud);
$('#mw5UseLocal').addEventListener('click',chooseLocalCampaign);
// Existing game emits this after its own redundant local save. Throttle cloud writes to limit usage.
document.addEventListener('monsterworks:saved',()=>{if(!uid||!saveReady)return;clearTimeout(pendingSaveTimer);pendingSaveTimer=setTimeout(()=>saveCloud(false),4000)});
// Send player positions ~5 times per second (only when changed) instead of every render frame.
setInterval(async()=>{if(!room||slotIndex===null||!connection)return;const current=safePlayer();if(!current)return;
 if(current.x===lastX&&current.y===lastY&&current.facing===lastFacing)return;
 if(Date.now()-lastPositionSent<320)return;
 lastPositionSent=Date.now();
 try{await update(ref(db,`rooms/${room}/slots/${slotIndex}`),current);lastX=current.x;lastY=current.y;lastFacing=current.facing}catch(e){message(`Position update: ${e.code||e.message}`,true)}
},350);
// Periodic autosave even while standing still, as insurance against abrupt tab closing.
setInterval(()=>{if(uid&&saveReady)saveCloud(false)},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&uid&&saveReady)saveCloud(false)});
window.addEventListener('pagehide',()=>{if(room&&slotIndex!==null&&connection){/* onDisconnect removes slot server-side */}});
render();init();

</script>
